"raw_burrata_starter.jpg", "kind": "image", "gen_model": "gpt-image-2", "gen_prompt": "Photoreal food photograph, raw unedited look, a creamy burrata starter torn open over heirloom tomatoes with basil oil and flaky salt on a dark ceramic plate, cooler prep-kitchen daylight (~5400K, cool neutral cast), slightly flat and a little bright, real creamy curd and tomato flesh texture, a small neutral 18% grey card and white chip at the edge of the frame as a white-balance reference, candid documentary style, no text, square 1:1", "realism_notes": "Session-B cool dish. Cool cast + slightly bright + flat contrast, needs warming toward the target and the shared dark-mode tone/black-floor — another opposite-direction correction from the warm frames, with white curd that will show any residual cast plainly."}, {"name": "raw_oysters_on_ice.jpg", "kind": "image", "gen_model": "gpt-image-2", "gen_prompt": "Photoreal food photograph, raw unedited look, six fresh oysters on crushed ice with a mignonette and lemon on a dark slate, cooler prep-kitchen daylight (~5800K, clearly cool/blue cast), bright specular glints on the wet shells and ice, real shell nacre and ice texture, a small neutral 18% grey card and white chip at the edge of the frame as a white-balance reference, candid documentary style, no text, square 1:1", "realism_notes": "Session-B cool dish, the coolest and brightest of all — strong blue cast plus blown-risk specular highlights on ice, so the correct grade warms the WB, pulls exposure down, and protects highlights while still hitting the shared black-floor. Its ice/shell whites are a sensitive check for residual cast at the common white point."}, {"name": "ostra_wordmark_logo.png", "kind": "image", "gen_model": "gemini-3-pro-image", "gen_prompt": "A minimalist flat restaurant wordmark logo, the single word OSTRA rendered in an elegant thin serif typeface, solid near-black charcoal lettering on a plain flat white background, a small leaf glyph as the dot over no letter but centered above the word, perfectly flat vector-style with crisp clean edges, no gradients no shadows no photographic texture, generous white margin around the mark, centered, high resolution", "realism_notes": "Flat solid-color wordmark on white so a white drop-out to transparency then a trim-to-bounds then a raster-to-vector trace produce a clean SVG. Crisp edges and a single dark ink color make the vectorize step honest; the generous white margin is what makes the trim-to-bounds prep step matter before tracing."}], "outputs": [{"name": "hero_dark_desktop.png", "kind": "image", "spec": "Full-bleed desktop website hero, ~2880x1620 (16:9), straightened, graded to the OSTRA house look (grey chip neutralized to the common white point; dark table surround floored at the common near-black level, deep but not clipped to 0), the scallop plate lifted so it reads off the dark surround, reframed by an honest off-center crop of the native 3:2 so the plate sits RIGHT and the existing dark table forms clean headline negative space on the LEFT, grey/white reference chips cropped out of frame, sRGB PNG."}, {"name": "hero_mobile_9x16.png", "kind": "image", "spec": "Full-bleed mobile Home crop, 1080x1920 (9:16), subject-aware crop of the graded, popped full-res hero (existing pixels only, honest downscale, no upscale, no canvas extend), reference chips out of frame, sRGB PNG."}, {"name": "menu_tile_short_rib.png", "kind": "image", "spec": "Square 1:1 menu-tile (~1200x1200), graded to MATCH the house look at the common white point and black-floor, reference chips cropped out, sRGB PNG."}, {"name": "menu_tile_cocktail.png", "kind": "image", "spec": "Square 1:1 menu-tile (~1200x1200), graded to MATCH the house look at the common white point and black-floor, reference chips cropped out, sRGB PNG."}, {"name": "menu_tile_fondant.png", "kind": "image", "spec": "Square 1:1 menu-tile (~1200x1200), graded to MATCH the house look at the common white point and black-floor (warmed and pulled down from a cool/bright daylight raw), reference chips cropped out, sRGB PNG."}, {"name": "menu_tile_burrata.png", "kind": "image", "spec": "Square 1:1 menu-tile (~1200x1200), graded to MATCH the house look at the common white point and black-floor (warmed from a cool raw, white curd holding neutral), reference chips cropped out, sRGB PNG."}, {"name": "menu_tile_oysters.png", "kind": "image", "spec": "Square 1:1 menu-tile (~1200x1200), graded to MATCH the house look at the common white point and black-floor (strongest warm correction, highlights on ice protected), reference chips cropped out, sRGB PNG."}, {"name": "logo_wordmark.svg", "kind": "vector", "spec": "Transparent, cleanly vectorized OSTRA wordmark as crisp SVG for retina/responsive use on the dark site, produced by white drop-out then trim-to-bounds then raster-to-vector trace (plus the transparent-PNG intermediate)."}, {"name": "grade_report.txt", "kind": "reference", "spec": "A plain parameter sheet the agent authors and returns: for each of the six food frames, the white-balance temperature and tint, the exposure offset, and the black-point value that were applied, plus the single common house-target white point and black-floor level all six were matched to. This is the acceptance artifact — it makes 'the set is matched to one target' checkable, and the corrections must be non-identical across the warm vs cool frames."}], "workflow": [{"n": 1, "tool": "asset_add_file", "server": "adobe", "exec_mode": "C", "inputs_from": "raw_hero_scallops.jpg, raw_short_rib.jpg, raw_cocktail_closeup.jpg, raw_dessert_flatlay.jpg, raw_burrata_starter.jpg, raw_oysters_on_ice.jpg, ostra_wordmark_logo.png", "output": "assets_uploaded", "note": "Bring the six raw plate captures and the flat wordmark into the working project in one load so the grade and the logo cleanup can run against real asset references. Plumbing only — not the difficulty."}, {"n": 2, "tool": "image_auto_straighten", "server": "adobe", "exec_mode": "C", "inputs_from": "assets_uploaded", "output": "hero_straightened", "note": "Level the ~4deg tilted horizon on raw_hero_scallops before any grading or reframing, so the later off-center crop is measured against a true horizon. Consumes the uploaded hero."}, {"n": 3, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "hero_straightened", "output": "hero_reference_grade", "note": "ESTABLISH the OSTRA house look on the signature frame and record it as the target the other five must hit. Using the neutral grey/white chip in the frame as reference, dial temperature COOLER and set tint to drive that chip to true neutral (kills the ~3200K warm cast), then build the dark-mode tonality with image_apply_adjustments primitives: set blacks so the dark table surround floors at the house near-black level (deep, not clipped — darkest tones held off zero), pull highlights to protect the scallop sear specular, lift shadows only enough to keep food out of mud, add modest clarity and vibrance. This is a reasoned authored grade, NOT a preset and NOT auto-tone. The agent must report the temp/tint/exposure/black values chosen here — they define the common target. Consumes step 2."}, {"n": 4, "tool": "image_select_subject", "server": "adobe", "exec_mode": "C", "inputs_from": "hero_reference_grade", "output": "hero_subject_mask", "note": "Select the scallop plate subject on the graded hero to drive a selective lift. Semantic subject selection (allowed); returns a mask URI. Consumes step 3."}, {"n": 5, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "hero_reference_grade, hero_subject_mask", "output": "hero_popped", "note": "Masked selective edit: apply a small exposure/clarity/vibrance lift to the plate subject ONLY, using step 4's mask, so the dish reads off the dark surround while the background black-floor set in step 3 is left untouched. image_apply_adjustments accepts a mask, so this is a genuine local edit — not a whole-image push that would also lift the surround and break the house black-floor. Consumes the step-3 image + step-4 mask."}, {"n": 6, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "hero_popped", "output": "hero_reframed_16x9", "note": "Honest off-center reframe of the popped 3:2 hero to 16:9: crop with the scallop plate offset RIGHT so the existing dark table on the LEFT becomes clean headline negative space, and crop the far-left grey/white reference chips OUT of frame in the same move. Downscale/reframe of existing pixels only — the canvas is never grown beyond the source and no pixels are invented. Consumes step 5."}, {"n": 7, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "hero_reframed_16x9", "output": "hero_dark_desktop", "note": "Resize the reframed 16:9 hero to the ~2880x1620 desktop full-bleed export dimensions. DELIVERABLE hero_dark_desktop.png. Consumes step 6."}, {"n": 8, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "hero_popped", "output": "hero_mobile_9x16", "note": "Subject-aware 9:16 crop of the FULL-RES popped hero (step 5, ~3024x2016) resized to exactly 1080x1920, chips outside the crop. Cropping from the full-res popped hero rather than the already-cropped 2880x1620 desktop file keeps the 1080x1920 target gen-free (honest downscale, no upscale, no canvas extend). DELIVERABLE hero_mobile_9x16.png."}, {"n": 9, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "assets_uploaded", "output": "shortrib_graded", "note": "Grade raw_short_rib to the SAME target set in step 3, reasoning its own correction. It is warm (~3200K) like the hero but a touch differently exposed, so cool the WB to land its grey chip on the common white point and lift exposure slightly less/more than the hero as its own histogram requires, then match the house black-floor and dark-mode curve. The reported numbers should be close to the hero's but NOT copied. Consumes the uploaded short rib."}, {"n": 10, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "shortrib_graded", "output": "menu_tile_short_rib", "note": "Crop the reference chip out and resize to the ~1200x1200 square tile. DELIVERABLE menu_tile_short_rib.png. Consumes step 9."}, {"n": 11, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "assets_uploaded", "output": "cocktail_graded", "note": "Grade raw_cocktail_closeup to the common target. Warm cast like the hero but BRIGHTER, so this frame needs the warm-to-neutral WB correction AND a downward exposure nudge (opposite exposure direction from the short rib), while still hitting the shared black-floor and protecting the glass/foam speculars. Report its distinct values. Consumes the uploaded cocktail."}, {"n": 12, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "cocktail_graded", "output": "menu_tile_cocktail", "note": "Crop the reference chip out and resize to the ~1200x1200 square tile. DELIVERABLE menu_tile_cocktail.png. Consumes step 11."}, {"n": 13, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "assets_uploaded", "output": "fondant_graded", "note": "Grade raw_dessert_flatlay to the common target — the OPPOSITE-direction correction. It is cool (~5600K) and brighter than the hero, so WARM the WB to neutralize its grey chip and pull exposure DOWN, then apply the shared dark-mode black-floor and curve so a bright daylight flat-lay reads as the same moody room. Copying the hero's cooling/lifting numbers here is exactly the trap that fails the match. Report its distinct values. Consumes the uploaded dessert."}, {"n": 14, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "fondant_graded", "output": "menu_tile_fondant", "note": "Crop the reference chip out and resize to the ~1200x1200 square tile. DELIVERABLE menu_tile_fondant.png. Consumes step 13."}, {"n": 15, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "assets_uploaded", "output": "burrata_graded", "note": "Grade raw_burrata_starter to the common target. Cool (~5400K), slightly bright and flat, so warm the WB toward neutral (watch the white curd, which shows any residual cast plainly), add contrast, and seat the black-floor at the house level. Its correction differs again from the fondant's because its cast and brightness differ. Report its distinct values. Consumes the uploaded burrata."}, {"n": 16, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "burrata_graded", "output": "menu_tile_burrata", "note": "Crop the reference chip out and resize to the ~1200x1200 square tile. DELIVERABLE menu_tile_burrata.png. Consumes step 15."}, {"n": 17, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "assets_uploaded", "output": "oysters_graded", "note": "Grade raw_oysters_on_ice to the common target — the strongest correction of the set. Coolest and brightest (~5800K, blue cast), so apply the largest warm WB shift and exposure pull-down, protect the blown-risk speculars on ice and wet shells (highlights held), and still land the grey chip on the common white point and the surround on the common black-floor. Report its distinct values. Consumes the uploaded oysters."}, {"n": 18, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "oysters_graded", "output": "menu_tile_oysters", "note": "Crop the reference chip out and resize to the ~1200x1200 square tile. DELIVERABLE menu_tile_oysters.png. Consumes step 17."}, {"n": 19, "tool": "image_remove_background", "server": "adobe", "exec_mode": "C", "inputs_from": "assets_uploaded", "output": "logo_transparent_png", "note": "Drop the flat white background of the wordmark to transparency so the mark sits cleanly on the dark site. White drop-out, no reconstruction. DELIVERABLE intermediate (transparent PNG). Consumes the uploaded logo."}, {"n": 20, "tool": "image_crop_to_bounds", "server": "adobe", "exec_mode": "C", "inputs_from": "logo_transparent_png", "output": "logo_trimmed", "note": "Prep-before-trace: trim the transparent wordmark to its own tight bounds (removes the generous white margin now transparent) so the vectorize step traces only the lettering and leaf glyph. Tracing the untrimmed frame would waste trace resolution on empty canvas and can leave a stray border path. Consumes step 19."}, {"n": 21, "tool": "image_vectorize", "server": "adobe", "exec_mode": "C", "inputs_from": "logo_trimmed", "output": "logo_wordmark_svg", "note": "Vectorize the trimmed transparent wordmark to crisp SVG for retina/responsive use on the dark site. Raster-to-vector trace of a prepared raster (straightened-by-nature flat mark, background knocked to transparency, cropped to bounds). DELIVERABLE logo_wordmark.svg. Consumes step 20."}], "tools_used": ["asset_add_file", "image_auto_straighten", "image_apply_adjustments", "image_select_subject", "image_crop_and_resize", "image_crop_to_bounds", "image_remove_background", "image_vectorize"], "tool_call_count": 21, "distinct_adobe_tools": 8, "difficulty_rationale": "Long-horizon food_bev_photo retouch scoped from the real brief's stressed pillar. Difficulty is DEPTH, not breadth: (a) cross-asset grade-MATCH of six differently-lit frames to a single measurable house target — a common white point read off each frame's in-frame grey chip and a common near-black floor — which forces non-identical per-frame corrections (three warm dinner frames cooled/lifted, three cool daylight frames warmed/pulled-down), authored from image_apply_adjustments primitives rather than a preset or auto-tone; (b) a masked selective lift on the hero (select_subject -> masked image_apply_adjustments) that must pop the plate WITHOUT lifting the surround that the black-floor depends on; (c) an honest two-stage gen-free reframe of the 3:2 hero to a 16:9 with left headline negative space that also crops the reference chips out; and (d) prep-before-trace logo discipline (white drop-out -> trim-to-bounds -> vectorize). The agent must report its final per-image parameters, making 'matched' checkable. Every step is headless-confirmed [C], server=adobe: no [W] Express widget, no [A] async media, no [T] template. No banned capability: no generative expand/outpaint, no gen-fill, no upscale/super-resolution, no text-to-image, no object-removal-with-reconstruction, no image_fill_area, no whole-image color_overlay sold as a masked edit, no render_* layout authoring; the web build is correctly out of scope.", "hardness_rationale": "FAILURE GATE: the acceptance artifact is a single matched dark-mode set — every frame's neutral grey chip must resolve to ONE common house white point and the dark surround to ONE common near-black floor (deep but not clipped to zero), and the agent must return a parameter sheet listing per-image temperature/tint/exposure/black. This is tripable: a set that is each internally 'auto-fixed' will diverge at the grey chips and be rejected, and identical reported numbers across warm and cool frames are a visible fail. HUMAN-HARD ELEMENTS: (1) cross-asset consistency to a measurable target across six frames shot under two opposite casts, which demands the counter-intuitive insight that a matched OUTPUT requires DIFFERENT per-frame corrections (warm frames cooled, cool frames warmed) reasoned from each frame's own chip and exposure — not one set of sliders; (2) a masked subject-only lift on the hero that must brighten the plate while preserving the surround black-floor the whole house look depends on; plus prep-before-trace logo discipline. TRAP: the naive path — run auto-tone (or one dark preset) on each of the six and call it a matched set — looks right because every frame reads fine alone, but auto-tone keys off each frame's own histogram, so rs (17->18, coolest/brightest, largest warm shift + highlight protection). LOGO tributary: remove_background (19, white drop-out to transparent PNG) -> crop_to_bounds (20, prep-before-trace trim) -> vectorize (21, logo_wordmark.svg). Cross-asset consistency is NOT enforced by repeating one recipe — each of steps 9/11/13/15/17 is a distinct correction whose only invariant is the shared target white point and black-floor from step 3, and the agent reports all six so the match is auditable.", "reverify": {"banned_capability_check": "No banned capability is used. All deprecated tool names are gone: the former image_adjust_brightness_and_contrast, image_adjust_color_temperature, and image_adjust_vibrance_and_saturation grade/WB/vibrance steps are all replaced by image_apply_adjustments (which exposes temperature, tint, exposure, contrast, highlights, shadows, whites, blacks, clarity, vibrance, saturation and accepts a mask); the former image_apply_preset cocktail step is removed so the house look is authored from primitives, not a preset pick; image_apply_auto_tone is removed from the correct path entirely (it appears only as the named trap). The masked hero lift uses image_apply_adjustments with a select_subject mask (a supported masked path), never image_apply_color_overlay (whole-image) and never image_fill_area (solid flat fill). image_crop_and_resize only straightens/reframes/downscales existing pixels — the 3:2->16:9 hero is an honest off-center CROP, never a canvas extend, and the 9:16 mobile is cut from the full-res popped hero, never upscaled. image_remove_background is a white drop-out to transparency (no reconstruction); image_crop_to_bounds trims; image_vectorize traces a prepared raster to SVG. No generative expand/outpaint, no gen-fill, no upscale/super-resolution, no text-to-image, no object-removal-with-reconstruction, no bespoke font design, no render_*/merge layout authoring, no measurement tool (the grey chip is a design reference and the agent reports <script>

  document.getElementById('sidefoot').textContent =
    tasks.length+' tasks · '+totalAssets+' input assets · '+totalSteps+' connector steps. Every task rebuilt to be hard for a human and the agent, connector-doable, and IP-clean, then passed an adversarial review.';

  // ---- render one task ----
  var main=document.getElementById('main');
  function sec(num,title,count){
    var s=el('section','blk'); var h=el('div','sechead');
    h.appendChild(el('span','snum',num));
    h.appendChild(el('h2',null,title));
    if(count!=null) h.appendChild(el('span','scount',count));
    s.appendChild(h); return s;
  }
  function render(t){
    main.innerHTML='';
    // header
    var eye=el('p','eyebrow');
    eye.appendChild(el('span',null,t.id+'  ·  '+t.tag));
    eye.appendChild(el('span','vpill','✓ passed adversarial review'));
    main.appendChild(eye);
    main.appendChild(el('h1','title serif',t.title));
    main.appendChild(el('p','lead',t.one_line_ask));
    var chips=el('div','chips');
    [['vertical',t.vertical],['type',t.workflow_nature],['calls',t.tool_call_count+' tool calls'],
     ['connectors',t.distinct_adobe_tools+' distinct'],['assets',t.inputs.length+' in → '+t.outputs.length+' out'],
     ['source',(t.source&&t.source.platform)||'']].forEach(function(p){
      if(!p[1]) return; var c=el('span','chip'); var b=el('b',null,p[0]+' '); c.appendChild(b); c.appendChild(document.createTextNode(String(p[1]).replace(/_/g,' '))); chips.appendChild(c);
    });
    main.appendChild(chips);

    // 1 brief
    var s1=sec('01','The client brief');
    s1.appendChild(el('div','prose',t.full_brief));
    main.appendChild(s1);

    // 2 what it tests
    var s2=sec('02','What this task tests');
    var box=el('div','tests');
    box.appendChild(el('p','tl','The failure gate, the trap, and the acceptance bar'));
    box.appendChild(el('p',null,t.hardness_rationale||t.difficulty_rationale));
    s2.appendChild(box);
    main.appendChild(s2);

    // 3 input assets
    var s3=sec('03','Input assets',t.inputs.length+' supplied');
    s3.appendChild(el('div','assetnote','Each asset below is generated to spec for the task. The description is the exact generation brief; the render is produced in the asset step.'));
    var g=el('div','grid');
    t.inputs.forEach(function(a){
      var kc=kindClass(a.kind);
      var card=el('div','acard k-'+kc);
      var th=el('div','athumb'); th.appendChild(el('span','glyph',glyph(kc))); th.appendChild(el('span','pending','preview pending')); th.appendChild(el('span','kindtag',a.kind||'asset')); card.appendChild(th);
      var bd=el('div','abody');
      bd.appendChild(el('div','aname',a.name||'asset'));
      if(a.gen_model && String(a.gen_model).indexOf('n/a')<0) bd.appendChild(el('div','ameta','model: '+a.gen_model));
      if(a.gen_prompt) bd.appendChild(el('div','adesc',a.gen_prompt));
      if(a.realism_notes){ var n=el('div','anote'); var b=el('b',null,'Why it is here: '); n.appendChild(b); n.appendChild(document.createTextNode(a.realism_notes)); bd.appendChild(n); }
      card.appendChild(bd); g.appendChild(card);
    });
    s3.appendChild(g); main.appendChild(s3);

    // 4 deliverables
    var s4=sec('04','Deliverables',t.outputs.length+' produced');
    var g2=el('div','grid');
    t.outputs.forEach(function(o){
      var card=el('div','ocard');
      var nm=el('div','oname'); nm.appendChild(document.createTextNode(o.name||'output'));
      if(o.kind){ nm.appendChild(el('span','okind',o.kind)); }
      card.appendChild(nm);
      card.appendChild(el('div','ospec',o.spec||''));
      g2.appendChild(card);
    });
    s4.appendChild(g2); main.appendChild(s4);

    // 5 workflow
    var s5=sec('05','The connector workflow',t.workflow.length+' steps');
    var steps=el('div','steps');
    t.workflow.forEach(function(w){
      var isA=(w.server||'').toLowerCase().indexOf('adobe')>-1 || (w.exec_mode||'')!=='';
      var st=el('div','step '+(isA?'adobe':''));
      var rail=el('div','rail'); rail.appendChild(el('div','node',String(w.n))); st.appendChild(rail);
      var sc=el('div','scard');
      sc.appendChild(el('div','stool',w.tool||''));
      if(w.inputs_from||w.output){ var fl=el('div','sflow');
        if(w.inputs_from) fl.appendChild(document.createTextNode(w.inputs_from));
        var ar=el('span','arrow',' → '); fl.appendChild(ar);
        if(w.output) fl.appendChild(document.createTextNode(w.output));
        sc.appendChild(fl); }
      if(w.note) sc.appendChild(el('div','snote',w.note));
      st.appendChild(sc); steps.appendChild(st);
    });
    s5.appendChild(steps); main.appendChild(s5);

    // 6 doability
    if(t.reverify && (t.reverify.banned_capability_check || t.reverify.notes)){
      var d=el('div','doab');
      d.appendChild(el('p','dl','✓ Doability check · every deliverable is producible with the real connectors'));
      if(t.reverify.banned_capability_check) d.appendChild(el('p',null,t.reverify.banned_capability_check));
      main.appendChild(d);
    }

    var f=el('div','pagefoot');
    f.textContent='StudioBench — tools used: '+(t.tools_used||[]).join(', ')+'.';
    main.appendChild(f);
    main.scrollTop=0; window.scrollTo(0,0);
  }
  function select(i){
    document.querySelectorAll('.navbtn').forEach(function(b){ b.setAttribute('aria-current', b.getAttribute('data-i')==String(i)?'true':'false'); });
    render(tasks[i]);
  }
  select(0);
})();
</script>
