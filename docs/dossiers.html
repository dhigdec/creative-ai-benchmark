<style>
:root{
  --bg:#eceef3; --surface:#ffffff; --surface-2:#f5f7fa; --surface-3:#eaeef6;
  --ink:#191b21; --ink-2:#484d5a; --muted:#767d8c; --line:#dde1ea; --line-2:#e8ebf1;
  --accent:#4b3fb0; --accent-2:#6a5fd0; --accent-soft:#4b3fb010;
  --ok:#1c7a49; --ok-soft:#1c7a4914; --amber:#95580f; --amber-soft:#95580f12; --rose:#a6376a;
  --shadow:0 1px 2px rgba(25,27,33,.05),0 10px 26px rgba(25,27,33,.05);
}

  :root:not([data-theme="light"]){
    --bg:#0d0f15; --surface:#151922; --surface-2:#1b202b; --surface-3:#222835;
    --ink:#e9ecf3; --ink-2:#a9b2c1; --muted:#6e7789; --line:#262d39; --line-2:#1f2530;
    --accent:#a99dff; --accent-2:#8a7fef; --accent-soft:#a99dff16;
    --ok:#4fd08a; --ok-soft:#4fd08a16; --amber:#e2a94e; --amber-soft:#e2a94e15; --rose:#f07aa8;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.38);
  }
}
:root[data-theme="dark"]{
  --bg:#0d0f15; --surface:#151922; --surface-2:#1b202b; --surface-3:#222835;
  --ink:#e9ecf3; --ink-2:#a9b2c1; --muted:#6e7789; --line:#262d39; --line-2:#1f2530;
  --accent:#a99dff; --accent-2:#8a7fef; --accent-soft:#a99dff16;
  --ok:#4fd08a; --ok-soft:#4fd08a16; --amber:#e2a94e; --amber-soft:#e2a94e15; --rose:#f07aa8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,sans-serif;line-height:1.6;font-size:15px}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.serif{font-family:"Fraunces",Georgia,serif}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* ---- shell ---- */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
@media (max-width:820px){ .shell{grid-template-columns:1fr} }

/* ---- sidebar ---- */
.side{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 20px}
@media (max-width:820px){ .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)} }
.brand{font-family:"Fraunces",serif;font-weight:600;font-size:20px;letter-spacing:-.01em;margin:0}
.brand .dot{color:var(--accent)}
.brandsub{font-size:12px;color:var(--muted);margin:4px 0 22px;line-height:1.45}
.navlabel{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.navlist{display:flex;flex-direction:column;gap:7px;list-style:none;padding:0;margin:0}
.navbtn{width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;color:inherit;font-family:inherit;transition:.15s;display:block}
.navbtn:hover{border-color:var(--accent-2)}
.navbtn[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.navbtn .nb-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.navbtn .nb-id{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;color:var(--accent)}
.navbtn .nb-pass{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.06em;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:2px 7px;white-space:nowrap}
.navbtn .nb-title{font-size:13.5px;font-weight:600;line-height:1.3;color:var(--ink)}
.navbtn .nb-tag{font-size:11.5px;color:var(--muted);margin-top:3px}
.sidefoot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.5}

/* ---- main ---- */
.main{padding:38px clamp(20px,4vw,54px);max-width:1040px}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eyebrow .vpill{color:var(--ok);background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);border-radius:999px;padding:2px 9px;font-size:10.5px;letter-spacing:.05em}
h1.title{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1.08;letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
.lead{font-size:17px;color:var(--ink-2);margin:0 0 20px;max-width:64ch;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{font-family:"JetBrains Mono",monospace;font-size:11px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink-2);background:var(--surface-2)}
.chip b{color:var(--accent);font-weight:600}

/* ---- sections ---- */
section.blk{margin-top:34px}
.sechead{display:flex;align-items:baseline;gap:11px;margin:0 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.sechead h2{font-family:"Fraunces",serif;font-weight:600;font-size:20px;letter-spacing:-.01em;margin:0}
.sechead .snum{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);font-weight:500}
.sechead .scount{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted)}

.prose{font-size:15px;color:var(--ink-2);line-height:1.68;white-space:pre-wrap;max-width:70ch}
.ground{margin-top:12px;font-size:12.5px;color:var(--muted);font-style:italic;border-left:2px solid var(--line);padding-left:12px;white-space:pre-wrap}

/* what it tests callout */
.tests{background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 30%,var(--line));border-radius:14px;padding:16px 18px}
.tests .tl{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin:0 0 8px;font-weight:600}
.tests p{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.62;white-space:pre-wrap}
.diff{margin-top:12px;font-size:13px;color:var(--muted);white-space:pre-wrap;line-height:1.55}

/* asset + output cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.athumb{height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;border-bottom:1px solid var(--line-2)}
.athumb .glyph{font-size:24px;opacity:.9}
.athumb .pending{font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);opacity:.85}
.athumb .kindtag{position:absolute;top:8px;right:8px;font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.k-image .athumb{background:linear-gradient(135deg,var(--accent-soft),transparent)} .k-image .glyph{color:var(--accent)}
.k-reference .athumb{background:linear-gradient(135deg,color-mix(in srgb,var(--accent-2) 12%,transparent),transparent)} .k-reference .glyph{color:var(--accent-2)}
.k-data .athumb{background:linear-gradient(135deg,var(--amber-soft),transparent)} .k-data .glyph{color:var(--amber)}
.k-video .athumb{background:linear-gradient(135deg,color-mix(in srgb,var(--rose) 12%,transparent),transparent)} .k-video .glyph{color:var(--rose)}
.k-template .athumb{background:linear-gradient(135deg,var(--ok-soft),transparent)} .k-template .glyph{color:var(--ok)}
.abody{padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.aname{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:600;color:var(--ink);word-break:break-all}
.ameta{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted)}
.adesc{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.anote{font-size:11.5px;color:var(--muted);line-height:1.45;border-top:1px dashed var(--line);padding-top:7px}
.anote b{color:var(--ink-2);font-weight:600}

.ocard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow)}
.oname{font-family:"JetBrains Mono",monospace;font-size:12.5px;font-weight:600;color:var(--ink);word-break:break-all;margin-bottom:6px}
.ospec{font-size:13px;color:var(--ink-2);line-height:1.55}
.okind{font-family:"JetBrains Mono",monospace;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:2px 7px;margin-left:6px}

/* workflow */
.assetnote{font-size:12px;color:var(--muted);margin:0 0 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.steps{display:flex;flex-direction:column;gap:0;counter-reset:none}
.step{display:grid;grid-template-columns:40px 1fr;gap:0}
.step .rail{position:relative;display:flex;justify-content:center}
.step .rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-50%);background:var(--line)}
.step:first-child .rail::before{top:15px} .step:last-child .rail::before{bottom:calc(100% - 15px)}
.step .node{position:relative;z-index:1;margin-top:9px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:600;color:var(--ink-2)}
.step.adobe .node{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.scard{padding:8px 0 16px 12px;min-width:0}
.stool{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:600;color:var(--accent);word-break:break-word}
.sflow{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);margin-top:3px;word-break:break-word}
.sflow .arrow{color:var(--accent-2)}
.snote{font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.5;max-width:74ch}

/* doability footer */
.doab{margin-top:20px;background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 30%,var(--line));border-radius:14px;padding:16px 18px}
.doab .dl{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);margin:0 0 8px;font-weight:600;display:flex;align-items:center;gap:7px}
.doab p{margin:0 0 8px;font-size:12.5px;color:var(--ink-2);line-height:1.55;white-space:pre-wrap}
.doab p:last-child{margin-bottom:0}
.pagefoot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}

<script id="showcase-data" type="application/json">{"generated": "2026-09-01", "count": 5, "tasks": [{"id": "AO-110", "tag": "Batch recolor without a reshoot", "title": "Summit & Sable eCommerce catalog: neutralize six mixed-lighting product shots to one house look by eye, then recolor hardware and label accents into two new colorways without a reshoot", "one_line_ask": "Bring six existing, mismatched Summit & Sable product photos to one consistent catalog house look, neutralizing each shot by eye to the neutral grey reference wedge it carries and reporting the correction you dialed, then generate two new colorways from shots we already own — a gunmetal version of the strap hardware and a deep-burgundy version of the printed label — keeping the original light, shadow, reflection and weave intact.", "vertical": "retail_ecommerce", "category": "color_grade_lr", "workflow_nature": "edit", "source": {"platform": "Upwork", "reference": "Professional Photoshop Editor Needed for Ongoing eCommerce Product Editing & Color Swapping"}, "grounding_note": "Adapted from a real Upwork brief (brand laundered to the fictional 'Summit & Sable'). The real ask: an ongoing eCommerce editor to make existing product photos consistent and to swap colors on specific product parts 'without ruining the original image — the lighting, shadows and textures must remain completely natural. We cannot accept sloppy masking, flat colors, or unrealistic edits.' The verbatim client acceptance bar is preserved as the pass/fail catch; no real brand, person, org or product is named anywhere in this spec.", "full_brief": "Summit & Sable is a direct-to-consumer overland recovery-gear brand refreshing its online catalog. We are NOT reshooting. We are handing you six product photos we already own (JPEG, roughly 2400x3000, sRGB) and the result has to read as one matched set on a white PDP, plus two extra colorways generated from shots we already have. The problem you are solving, not the buttons you press: the six were shot across two separate sessions on three different setups, so side by side they look like they came from three different stores — some frames came out cool/blue, some warm, one was shot under mixed shop fluorescents and has a sickly green cast, one is muddy and flat, one is clearly underexposed. Every frame was shot with our neutral grey reference wedge (a light / mid / dark neutral three-patch card) lying flat on the white sweep in one corner; that wedge is your ground truth. Job one: make the catalog consistent, by eye. On EVERY graded image the three grey patches must read as true neutral (no blue, no amber, no green/magenta tint), the mid patch must sit at the same mid-grey brightness across all six, the white sweep must stay clean and below clipping (no blown paper), and the darkest patch must stay off pure black (no crushed shadows). Here is the craft, and it is where our last editor failed: the six did NOT start from the same place, so there is no single correction that fixes them. Each frame arrived with its own problem, and a move that rescues one frame drives another further off. You have to judge each frame by eye off its own wedge — work out what is actually wrong with that frame and choose the right control to neutralize it — and dial that frame its own correction until all six wedges land on the same neutral and the same mid-grey. Diagnosing each cast and picking the axis that clears it is your call, not ours. Do NOT reach for one global white-balance number, do NOT copy one frame's settings onto the others, and do NOT auto-tone each frame to look fine on its own: auto-tone keys off each frame's own histogram, so the casts will not agree and the set will visibly fail to match at the wedge, and we will reject it. The look itself — the contrast, the crispness that makes woven webbing and machined metal read, the restrained pop against white — is yours to build and hold identical across the set; there is no loadable preset to lean on, only our one-page house-look target (neutral wedge + whites-held + gentle contrast + modest vibrance). Job two: two new colorways, no reshoot. On the recovery-strap hero, the safety-orange anodized hardware has to become a gunmetal/graphite finish so we can list a second colorway — and note the hardware sits against orange woven webbing of nearly the same hue, so a lazy color swap will drag the webbing and the sweep with it. On the ratchet-strap shot, the printed label's red brand block has to deepen to our new deep-burgundy house color. THE CATCH, and this is exactly what our last editor got wrong: change the color without ruining the shot. The new finish has to sit UNDER the existing highlights, shadows, metal reflections and the woven-webbing / stitched-label texture — the original light stays, only the pigment changes. No sloppy masking, no flat dead-fill color, no halo, no unrealistic edits; the white text on the label must stay crisp and legible. Deliverables: the six graded catalog JPEGs at web resolution (long edge 2000px, sRGB), the two recolored variant images at the same web spec, and a short note listing the final correction parameters you APPLIED to each of the six frames — the temperature and tint direction and amount, exposure, highlight/shadow, contrast, clarity and vibrance you dialed — so we can confirm each frame got its own move rather than one recipe copied across the batch.", "inputs": [{"name": "prod_01_recovery_strap_red.jpg", "kind": "image", "gen_model": "gpt-image-2", "gen_prompt": "Photoreal ecommerce product photo of a bright safety-orange coiled off-road recovery tow strap with woven nylon webbing texture and an anodized safety-orange metal snatch-hook / shackle fitting clipped to one end, arranged on a seamless white sweep. In the lower-left corner, lying flat on the sweep, a small neutral photographic reference wedge showing three side-by-side neutral patches (light grey, mid grey, dark grey), no color tint on the card itself. Distinctly cool / blue white balance and flat under-lit studio lighting, so the grey wedge visibly skews bluish; real fabric weave detail, subtle soft contact shadow under the coil. Un-graded, straight-off-camera catalog look.", "realism_notes": "Hero #1 and the gunmetal recolor target. Deliberately COOL/blue and flat so its wedge reads bluish and the neutralization is real work. Crucially the orange metal fitting sits against orange webbing of nearly the same hue, so a hue-based or whole-image recolor would drag the webbing too — the recolor demands a semantic part selection. gpt-image-2 for photoreal metal + fabric texture and a clean neutral wedge."}, {"name": "prod_02_snatch_shackle_closeup.jpg", "kind": "image", "gen_model": "gpt-image-2", "gen_prompt": "Photoreal macro ecommerce product photo of an anodized safety-orange aluminum off-road snatch shackle / recovery hook, close up on a white seamless sweep, showing machined metal edges, bright specular highlights and a soft contact shadow. In one corner, flat on the sweep, the same small three-patch neutral grey reference wedge (light / mid / dark). Distinctly WARM white balance and slightly overexposed versus a matched set, so the grey wedge skews amber and the specular highlights ride near clipping. Real metal reflections, un-retouched catalog look.", "realism_notes": "Second-session shot with the OPPOSITE (warm, brighter) cast to prod_01, so a single shared correction cannot fix both — the batch genuinely needs opposite per-frame WB moves plus highlight protection to keep the specular metal off the clip ceiling."}, {"name": "prod_03_soft_shackle.jpg", "kind": "image", "gen_model": "gpt-image-2", "gen_prompt": "Photoreal ecommerce product photo of a grey synthetic soft-shackle rope loop for off-road recovery on a white seamless sweep, flat even lighting, low contrast and slightly muddy/hazy, faint neutral-cool cast, real braided-rope texture and a faint soft shadow. In a corner, flat on the sweep, the same three-patch neutral grey reference wedge. Straight-off-camera, un-graded catalog shot.", "realism_notes": "Muddy, low-contrast, faint-cool member. Exercises contrast/clarity recovery to defeat the haze while still landing the wedge on the same neutral and mid-grey brightness as the rest — not just a WB nudge."}, {"name": "prod_04_folding_shovel.jpg", "kind": "image", "gen_model": "gpt-image-2", "gen_prompt": "Photoreal ecommerce product photo of a black folding off-road recovery shovel / entrenching tool with an orange handle grip, laid on a white seamless sweep, clearly UNDEREXPOSED and dull, the white sweep reading grey rather than white, real metal and rubber texture, soft realistic shadow. In a corner, flat on the sweep, the same three-patch neutral grey reference wedge, sitting dark. Un-graded catalog shot.", "realism_notes": "The underexposed member. A large exposure/shadow lift is required to bring the grey sweep up to white and the wedge up to legibility, plus highlight/whites restraint so the recovered sweep does not blow past the clip ceiling and the dark patch does not float off true black — a single reasoned exposure-rescue grade, distinct in magnitude from every other frame, so copying any other frame's numbers here visibly under- or over-shoots."}, {"name": "prod_05_recovery_tracks.jpg", "kind": "image", "gen_model": "gpt-image-2", "gen_prompt": "Photoreal ecommerce product photo of a pair of orange traction recovery boards / sand tracks stacked on a white seamless sweep, lit by mixed overhead shop fluorescents so the whole frame carries a distinct sickly GREEN cast, flat lighting, real molded-plastic texture with cleats, soft shadow. In a corner, flat on the sweep, the same three-patch neutral grey reference wedge, visibly skewing green. Straight-off-camera, un-retouched.", "realism_notes": "The green/magenta tint case. This frame's cast is on the TINT axis, not the temperature axis — a warm/cool move will never clear it; the correct neutralization pushes tint toward MAGENTA (with only a small temperature trim). It is the frame that most cleanly exposes a one-global-WB or temperature-only approach, because those cannot touch a green cast at all, so its wedge stays green while the others look fixed."}, {"name": "prod_06_ratchet_strap_labeled.jpg", "kind": "image", "gen_model": "gpt-image-2", "gen_prompt": "Photoreal ecommerce product photo of a black ratchet tie-down strap coiled on a white seamless sweep, with a printed woven brand label sewn onto the webbing showing a solid RED rectangular brand block. The label reads 'SUMMIT & SABLE' in small clean white text, with a smaller line of white spec text beneath. In a corner, flat on the sweep, the same three-patch neutral grey reference wedge. Distinctly WARM white balance and flat lighting, so the wedge skews amber. Real webbing weave and stitched-label texture, soft shadow. Un-graded catalog shot.", "realism_notes": "Second recolor hero: carries the RED printed label block that gets settled to a deep burgundy via a masked in-band desaturate-and-darken (a small hue nudge inside the red band, NOT a rotation off red — so it stays inside image_adjust_hsl's realistic range) while the small white text stays legible. Warm cast again, so it needs a cooling correction opposite to the cool frames. Label kept clean and legible with the fictional brand name so a semantic select_by_prompt can isolate just the red block."}, {"name": "summit_sable_house_look_target.pdf", "kind": "reference", "gen_model": "n/a-authored-asset", "gen_prompt": "AUTHORED one-page house-look target sheet (supplied by the client, not model-generated, and NOT a loadable develop preset): states the Summit & Sable catalog acceptance target in words and reference swatches only — the three-patch neutral grey wedge must read neutral (equal R/G/B, no residual tint) on every graded frame; the mid grey patch must sit at a consistent mid catalog brightness across the set; the white sweep must stay clean and below clipping (no blown paper); the darkest patch must stay off pure black; overall a gentle contrast S-curve, enough clarity to resolve webbing weave and machined metal, and a modest vibrance lift so products pop on white without oversaturating. It is a target to hit by eye, not a preset to apply.", "realism_notes": "Deliberately a written/visual TARGET, not an .xmp or a built-in preset name. The agent must BUILD the look from primitive tone controls and hold it identical across the batch, neutralizing each frame to the in-frame wedge BY EYE — there is no preset to lean on. This is what makes the look agent-authored rather than a preset pick. The numeric tolerances on the wedge belong to the grader, not to any step the agent performs."}], "outputs": [{"name": "catalog_graded_x6", "kind": "image", "spec": "Six color-graded product JPEGs, each corrected on its own terms — the cool frames warmed, the warm frames cooled, the green frame pushed on the tint axis toward magenta, the underexposed frame exposure-rescued, the muddy frame contrast-recovered — so that its in-frame three-patch grey wedge reads true-neutral and its mid patch matches the set mid-grey, whites held below clipping and blacks off pure black, then the same authored house look (gentle contrast S-curve + clarity + modest vibrance, built from primitive adjustments, no preset) held identical across all six; sRGB, long edge 2000px, a genuinely matched catalog set rather than six independently 'auto' frames. Acceptance (grader-checked): on every frame the three grey patches read neutral within a tight channel-spread tolerance, the mid patch matches a shared mid-grey level, the white sweep stays below the clip ceiling and the darkest patch stays off pure black; the grader measures these on the output, the agent does not."}, {"name": "variant_strap_gunmetal.jpg", "kind": "image", "spec": "Recolored colorway of prod_01: the anodized safety-orange strap HARDWARE (the metal snatch-hook / shackle fitting only) recolored to a gunmetal/graphite finish via a semantic part selection plus two masked, luminosity-preserving image_adjust_hsl passes (a bounded hue shift plus a strong desaturate-and-darken, then a residual-chroma trim and luminance placement) riding the original luminosity, so the existing specular highlights, shadows and metal reflections survive and the orange woven webbing and white sweep are untouched — no whole-image overlay, no flat fill, no halo; already graded to the house look; sRGB, long edge 2000px. Acceptance (grader-checked): the orange webbing and white sweep are unchanged versus the graded base, the hardware's original highlight/shadow luminance structure is preserved, and the finish reads as a desaturated graphite rather than a flat painted grey."}, {"name": "variant_label_burgundy.jpg", "kind": "image", "spec": "Recolored colorway of prod_06: the printed label's red brand block settled to the deep-burgundy house color inside a tight semantic selection via a masked in-band desaturate-and-darken (a small hue nudge within the red band plus a strong saturation pull-down and luminance darken, not a hue rotation off red), preserving the woven-label stitch texture, the small white brand text legibility and the surrounding black webbing — the pigment changes but the printed-label lighting and texture stay intact; already graded to the house look; sRGB, long edge 2000px. Acceptance (grader-checked): the white brand text stays crisp and legible, the surrounding black webbing is unchanged, and the block's original luminance/texture survives the shift rather than being flat-filled."}, {"name": "grade_parameter_report", "kind": "text", "spec": "A short written report the agent authors and returns listing, per frame (prod_01..prod_06), the final correction it APPLIED — temperature and tint direction and amount, exposure and highlight/shadow moves, contrast, clarity and vibrance it dialed — and naming which axis carried each frame (warm-to-neutral, cool-to-neutral, magenta tint for the green frame, exposure-rescue for the dark frame, contrast recovery for the muddy frame). This is an APPLIED-settings log, not a measurement: the agent knows these values because it set them by eye. It is the acceptance artifact that makes the divergent per-frame reasoning visible and exposes whether one recipe was lazily copied across opposite casts. Acceptance (grader-checked): the six reported corrections are non-identical and their directions match each frame's stated cast — in particular the green frame carries a tint (not a temperature) move and the warm and cool frames move in opposite temperature directions."}], "workflow": [{"n": 1, "tool": "asset_add_file", "server": "adobe", "exec_mode": "C", "inputs_from": "prod_01_recovery_strap_red.jpg, prod_02_snatch_shackle_closeup.jpg, prod_03_soft_shackle.jpg, prod_04_folding_shovel.jpg, prod_05_recovery_tracks.jpg, prod_06_ratchet_strap_labeled.jpg, summit_sable_house_look_target.pdf", "output": "catalog_assets_uploaded", "note": "Upload the six existing product photos and the one-page house-look target so the grade can run against real asset references. Plumbing only — not part of the difficulty."}, {"n": 2, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "catalog_assets_uploaded", "output": "p1_graded", "note": "Grade prod_01 (cool/blue, flat). Judge the bluish cast by eye off the wedge and WARM the temperature toward neutral (dial and record the temp; add a touch of tint only if the wedge also skews green), lift exposure/shadows modestly out of the flat baseline, then lay in the authored house look built here from primitives: a gentle contrast S-curve, clarity to resolve the webbing weave, whites held below the clip ceiling so the sweep stays clean, blacks seated just off pure black, and a modest vibrance lift. Goal: the three grey patches look neutral by eye and the mid patch reads at the set mid-grey. Single authored adjustment call, not a preset and not auto-tone."}, {"n": 3, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "catalog_assets_uploaded", "output": "p2_graded", "note": "Grade prod_02 (warm, slightly over) — the OPPOSITE temperature move to prod_01: COOL the temperature toward the same neutral wedge target and pull exposure/highlights down so the specular metal stays off the clip ceiling, then apply the identical house-look contrast/clarity/vibrance character so it matches the set. Applying prod_01's warming here would push this frame further amber — judging the wedge by eye is what tells the agent to reverse direction. Report the cooling amount dialed."}, {"n": 4, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "catalog_assets_uploaded", "output": "p3_graded", "note": "Grade prod_03 (muddy, low-contrast, faint-cool). The dominant move is contrast + clarity to defeat the haze and resolve the braided rope, plus a mild warm nudge to neutralize the faint cool wedge; land the mid patch on the shared mid-grey without letting the added contrast crush the dark patch or blow the sweep. House-look vibrance to match. Report the contrast/clarity and the mild warm applied."}, {"n": 5, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "catalog_assets_uploaded", "output": "p4_graded", "note": "Grade prod_04 (clearly underexposed) — the exposure-rescue frame: a large exposure + shadow lift to bring the grey sweep up toward white and the wedge up to legibility, held in check by pulling highlights/whites so the recovered sweep does not blow past the clip ceiling and the dark patch stays off pure black, plus a slight warm toward neutral and the house-look contrast/clarity/vibrance. The magnitude of this lift is unique to this frame; copying any other frame's exposure here visibly under- or over-shoots. Report the exposure/shadow/highlight moves dialed."}, {"n": 6, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "catalog_assets_uploaded", "output": "p5_graded", "note": "Grade prod_05 (green fluorescent cast) — the TINT-axis frame. This one does NOT move on the warm/cool axis: judge the green wedge by eye and push TINT toward MAGENTA to neutralize it (with only a small temperature trim), then seat the mid/whites/blacks on the shared target and apply the identical house-look character. A temperature-only correction, a single global WB copied from the warm or cool frames, or an auto-tone pass cannot clear a green cast at all — this frame's wedge would stay green while the others look fixed, which is the visible failure this gate catches. Report the magenta tint amount and confirm it is a tint (not a temperature) move."}, {"n": 7, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "catalog_assets_uploaded", "output": "p6_graded", "note": "Grade prod_06 (warm, flat, carries the red label) — COOL toward neutral like prod_02, house-look contrast/clarity/vibrance, protecting the red label block and its small white text so the later recolor selection stays clean. Wedge to shared neutral by eye; this graded frame is the base for the label colorway. Report the cooling applied."}, {"n": 8, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "p1_graded", "output": "web_p1", "note": "Downscale graded prod_01 to the web catalog spec (long edge 2000px, sRGB). Never canvas-extend; downscale of existing pixels only."}, {"n": 9, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "p2_graded", "output": "web_p2", "note": "Downscale graded prod_02 to the same web catalog spec."}, {"n": 10, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "p3_graded", "output": "web_p3", "note": "Downscale graded prod_03 to web catalog spec."}, {"n": 11, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "p4_graded", "output": "web_p4", "note": "Downscale graded prod_04 to web catalog spec."}, {"n": 12, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "p5_graded", "output": "web_p5", "note": "Downscale graded prod_05 to web catalog spec."}, {"n": 13, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "p6_graded", "output": "web_p6", "note": "Downscale graded prod_06 to web catalog spec; web_p1..web_p6 form the catalog_graded_x6 matched set."}, {"n": 14, "tool": "image_select_by_prompt", "server": "adobe", "exec_mode": "C", "inputs_from": "p1_graded", "output": "strap_hardware_mask", "note": "Semantic selection of ONLY the metal fitting: 'the anodized metal snatch-hook / shackle fitting clipped to the end of the recovery strap'. This is the triage crux — the fitting and the webbing are nearly the same orange hue, so a hue-based selection or a whole-image tool cannot separate them; only a semantic, object-level selection isolates the hardware. Returns a maskURI."}, {"n": 15, "tool": "image_adjust_hsl", "server": "adobe", "exec_mode": "C", "inputs_from": "p1_graded, strap_hardware_mask", "output": "strap_hue_shifted", "note": "Masked recolor pass 1 (consumes the graded hero AND the hardware mask): within the selection only, apply a bounded hue shift off the safety-orange and pull its saturation down hard — a desaturate-and-darken move toward gunmetal, which is inside image_adjust_hsl's realistic range (it shifts a band moderately and desaturates/darkens strongly; it CANNOT do a near-complementary rotation, so this is deliberately a desaturate-to-graphite, not an amber-to-teal swing). The existing luminosity carries the metal's specular highlights and contact shadows. image_adjust_hsl is used because it is the ONLY masked recolor path the connector exposes; image_apply_color_overlay is whole-image with no mask (it would tint the orange webbing and the white sweep) and image_fill_area is a flat solid fill that would erase the metal reflections — the exact 'flat dead-fill' the brief rejects."}, {"n": 16, "tool": "image_adjust_hsl", "server": "adobe", "exec_mode": "C", "inputs_from": "strap_hue_shifted, strap_hardware_mask", "output": "strap_gunmetal_fullres", "note": "Masked recolor pass 2 (same mask): trim the residual chroma and place the luminance of the selected hardware so it lands on a true graphite/gunmetal rather than a washed neutral grey, still riding the original luminosity so highlights and machined-edge texture stay natural. A single desaturate can't hit gunmetal without this second luminance/chroma placement — hence two dependent masked passes, not one. Still at the full ~2400x3000 hero frame."}, {"n": 17, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "strap_gunmetal_fullres", "output": "variant_strap_gunmetal.jpg", "note": "Downscale the finished gunmetal colorway to the web catalog spec (long edge 2000px, sRGB) so the variant matches the catalog set frame."}, {"n": 18, "tool": "image_select_by_prompt", "server": "adobe", "exec_mode": "C", "inputs_from": "p6_graded", "output": "label_red_block_mask", "note": "Semantic selection of only the printed red brand block: 'the solid red rectangular printed label block on the strap webbing', deliberately excluding the small white brand text and the surrounding black webbing so the hue shift stays inside the red pigment. Returns a maskURI."}, {"n": 19, "tool": "image_adjust_hsl", "server": "adobe", "exec_mode": "C", "inputs_from": "p6_graded, label_red_block_mask", "output": "label_burgundy_fullres", "note": "Masked recolor (consumes the graded shot AND the label mask): within the selection only, settle the red block to a deep burgundy house color — a small in-band hue nudge plus a strong saturation pull-down and a luminance darken, which is squarely inside image_adjust_hsl's realistic range (it shifts a band moderately and desaturates/darkens strongly; burgundy is dark, desaturated red, NOT a hue rotation away from red, so this stays well under the tool's ~90deg ceiling — no near-complementary red->green swing). The existing luminosity carries the printed-label lighting and stitch texture so they survive and the white brand text stays crisp and legible. Masked image_adjust_hsl only — no whole-image overlay, no flat fill over the lettering. Still at the full hero frame."}, {"n": 20, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "label_burgundy_fullres", "output": "variant_label_burgundy.jpg", "note": "Downscale the finished deep-burgundy label colorway to the web catalog spec (long edge 2000px, sRGB) so the variant matches the set frame."}], "tools_used": ["asset_add_file", "image_apply_adjustments", "image_crop_and_resize", "image_select_by_prompt", "image_adjust_hsl"], "tool_call_count": 20, "distinct_adobe_tools": 5, "difficulty_rationale": "Depth over breadth: 20 connector calls, 5 distinct Adobe tools, but the difficulty is in adaptive per-frame reasoning, not step count. The six frames start on three different casts across two axes, so there is no single correction that matches the set — the agent must diagnose each frame by eye off its in-frame grey wedge and apply divergent, differently-weighted corrections that all converge on one neutral wedge + one mid/whites/blacks target: warm-to-neutral and cool-to-neutral on the temperature axis, a magenta push on the TINT axis for the green frame (which a temperature move cannot fix), an exposure-rescue of unique magnitude for the dark frame, and a contrast/clarity recovery for the muddy frame. The house look is authored from primitive tone controls (contrast/clarity/vibrance/whites/blacks) and held identical, not picked from a preset and not delegated to auto-tone. The recolor kernel is a genuine constraint-reasoning problem: orange hardware against orange webbing can only be separated semantically, then recolored with two masked luminosity-preserving HSL passes (a desaturate-and-darken to graphite, within image_adjust_hsl's realistic range) because the connector's whole-image color tools would tint the wrong pixels and its fill tool would flatten the metal. No banned capability is used, and no step asks the agent to measure a pixel.", "hardness_rationale": "Failure gate (a craft decision with a visible failure mode, not a self-measurement): the six shots start on divergent casts across two colour axes, and the agent must dial each frame its own correction BY EYE — warm frames cooled, cool frames warmed, the green fluorescent frame pushed toward MAGENTA on the tint axis, the dark frame exposure-rescued, the muddy frame contrast-recovered. The naive path — one global white-balance number, one frame's settings copied across the batch, or auto-tone run per frame — visibly fails to match at the wedge: auto-tone keys off each frame's own histogram so the casts never agree, a temperature-only or single-global move cannot touch the green cast at all (its wedge stays green while the rest look fixed), and reusing a warm frame's setting on another warm frame under-corrects. The failure is legible on the in-frame wedge without any pixel readout, and the required grade_parameter_report — an APPLIED-settings log, not a measurement — exposes identical-params laziness directly. Human-hard elements: (1) cross-asset consistency to a measurable target — six differently-lit assets all neutralized to the same in-frame wedge and the same mid/whites/blacks, not a single hero, which demands the counter-intuitive insight that a matched OUTPUT requires DIFFERENT per-frame corrections across two different axes; (2) constraint-reasoning + triage in the recolor — the anodized hardware sits against webbing of the same orange hue, so it can only be isolated semantically (select_by_prompt on the fitting) and recolored with two masked luminosity-preserving image_adjust_hsl passes (a bounded desaturate-and-darken to graphite, staying inside the tool's realistic range), since image_apply_color_overlay is whole-image and image_fill_area is flat dead-fill. The trap: reaching for the obvious 'color' tools — a graphite image_apply_color_overlay or an image_fill_area over the hardware — looks correct and fails, tinting the webbing/sweep or killing the metal reflections into exactly the flat fill the client rejects; and on the grade side, a one-recipe / one-global-WB / auto-tone pass leaves the opposite-cast and green frames unmatched. Measurable acceptance criterion (grader-side, the agent never measures): every graded frame's grey wedge reads true-neutral within a channel-spread tolerance with the mid patch on a shared mid-grey, whites below clipping and blacks off pure black at long edge 2000px sRGB; the two colorways preserve original luminosity/texture with untouched surrounds; and the delivered grade_parameter_report lists non-identical per-frame corrections whose directions match each frame's cast (in particular a tint move on the green frame and opposite temperature moves on the warm vs cool frames) — so 'matched to the wedge' is checkable rather than asserted, and the agent supplies parameters it applied rather than values it read.", "chaining_note": "Strict output->input chaining. Six per-frame grades fan out from catalog_assets_uploaded, but each is a DIFFERENT authored correction driven to a common wedge target, not a repeated identical call: prod_01 warm-to-neutral, prod_02 cool-to-neutral (opposite direction), prod_03 contrast/clarity haze recovery, prod_04 exposure-rescue of unique magnitude, prod_05 a TINT-axis magenta push for the green fluorescent cast (a move the temperature-only frames never make), prod_06 cool-to-neutral. There is no self-measured verification loop — the agent neutralizes each wedge by eye and reports the parameters it applied; the numeric wedge tolerance is the grader's. Six resizes produce the matched web set (web_p1..web_p6). The recolor kernel then runs twice: a semantic select_by_prompt feeds a masked image_adjust_hsl chain (two dependent passes for the gunmetal hardware desaturate-and-place, one masked in-band desaturate-and-darken pass for the deep-burgundy label), each ending in a web-frame resize. No auto-tone, no preset, no whole-image color tool, no fill_area. The masked HSL steps consume BOTH the graded base image AND the semantic mask.", "reverify": {"banned_capability_check": "No banned capability is used. No generative AI: no text-to-image, no generative fill/expand, no AI object removal-and-reconstruction, no background replacement, no upscaling/super-resolution, no bespoke font design. image_crop_and_resize only DOWNSCALES finished frames to the web spec (long edge 2000px) and never canvas-extends. The house look is built entirely from image_apply_adjustments primitives (temperature/tint/exposure/highlights/shadows/whites/blacks/contrast/clarity/vibrance) — deliberately NOT image_apply_preset and NOT image_apply_auto_tone, so the look is agent-authored per gate 3, and auto-tone/one-global-WB/identical-params are named only as the trap. NO MEASUREMENT ANYWHERE: the agent never reads a pixel, hex, channel or luminance value — it neutralizes each in-frame grey wedge BY EYE and REPORTS the temperature/tint/exposure/contrast/clarity/vibrance it APPLIED (values it knows because it dialed them). The prior self-measured 'read the wedge and recorrect' pass on the underexposed frame is removed; prod_04 is now a single reasoned exposure-rescue grade and the failure gate is a craft decision (divergent per-frame corrections across the temperature and tint axes) with a visible failure mode on the wedge, not a self-measurement loop. Numeric wedge tolerances are stated only as grader-checked acceptance in the outputs, never as agent workflow steps. image_adjust_hsl is used within its realistic range: a masked desaturate-and-darken to graphite for the hardware and a masked in-band desaturate-and-darken to deep burgundy for the label (a small hue nudge within the red band, NOT a rotation off red) — NOT a controlled near-complementary rotation and never exceeding the tool's ~90deg ceiling. Both recolors use image_select_by_prompt (semantic, object-level — never a hue or coordinate selection) followed by masked image_adjust_hsl, the ONLY masked recolor path the connector exposes; image_apply_color_overlay (whole-image, no mask) and image_fill_area (flat solid fill) are explicitly avoided and named in-spec as the trap. No image_remove_background/compositing/background replacement — recolors happen in place on existing pixels, preserving original luminosity, shadow and texture per the client catch. The supplied house-look reference is a written/visual TARGET, not a loadable .xmp preset. All deprecated tool names are gone (the prior spec's image_adjust_color_temperature and image_adjust_vibrance_and_saturation are replaced by image_apply_adjustments). All steps server=='adobe'.", "notes": "REVISION applied to fix the skeptic's killing issue (the grade failure gate depended on the agent READING the in-frame wedge, a banned measurement, and the 'read wedge and recorrect' branch was a narrated no-op that collapsed the six grades to open-loop): (1) removed the p4_pass1 -> p4_graded self-measured check-and-recorrect pass entirely; prod_04 is now a single exposure-rescue grade of unique magnitude; (2) replaced the no-op branch with a REAL craft gate — divergent per-frame corrections by eye across two colour axes (warm cooled, cool warmed, plus a NEW green/magenta tint case on prod_05) whose naive alternative (one global WB / identical params / per-frame auto-tone) visibly fails to match at the wedge, with the green cast being unfixable by a temperature-only move; (3) rewrote every step and brief line so the agent neutralizes BY EYE and REPORTS applied parameters, never reads a pixel — the numeric wedge tolerance is now stated only as grader-checked acceptance in the outputs; (4) kept the masked-HSL recolor kernel (steps 14-20) intact as the failable core, tightened to image_adjust_hsl's realistic desaturate-and-darken / bounded-shift range. Counts reconciled to the actual 20-step array (5 distinct tools); one grade step removed vs the prior 21. SURGICAL FIX: (1) stripped the method leakage from full_brief -- removed the per-cast corrective prescriptions (warm-the-cool / cool-the-warm / push-magenta-on-the-green) and the tint-vs-temperature insight so the brief states ONLY the client goal (the set must match at the in-frame grey wedge and one global correction will not do it) and the agent must diagnose each frame's cast and choose the axis itself. The divergent-corrections failure gate and the one-global / identical-params / auto-tone trap are preserved; the correct per-frame solution (including the magenta tint move on the green frame) remains only in the connector_workflow solution and the grader acceptance, never in the agent-facing brief. (2) Retargeted the label recolor from red->forest-green (a >90deg rotation past image_adjust_hsl's ~90deg ceiling) to red->deep burgundy -- a masked in-band desaturate-and-darken squarely inside the tool's realistic range; renamed variant_label_forest_green -> variant_label_burgundy and label_forest_green_fullres -> label_burgundy_fullres consistently. Counts unchanged (20 steps, 5 distinct tools) and the masked-HSL recolor kernel stays intact as the failable core.", "severity": "pass"}}, {"id": "AO-74", "tag": "Data-merge print line sheets", "title": "Thornfield & Rye Bakehouse wholesale line sheets: neutralize ten mixed-light product shots to an in-frame grey card, prep + vectorize the wordmark, and data-merge one press-ready sell sheet per SKU", "one_line_ask": "Neutralize ten mixed-lighting bakery product photos to the 18% grey card each one carries so they read as one matched set, decide per frame how far to move white balance without killing any product's genuine color, recolor a gift-box ribbon to a seasonal colorway without reshooting, prep and vectorize the scanned wordmark, then data-merge the client's authored single-record InDesign template against the roster to produce one press-ready line sheet per SKU.", "vertical": "retail_ecommerce", "category": "datamerge_print", "workflow_nature": "create-edit", "source": {"platform": "Freelancer.com", "reference": "Bakery B2B Catalog Development"}, "grounding_note": "Adapted from a real Freelancer.com bakery B2B brief (a wholesale bakery wanting distributor-facing product material with 'comprehensive product descriptions, detailed pricing, and high-quality images for every product') and laundered to a fictional brand, 'Thornfield & Rye Bakehouse' — no real company, product, or trademark is named. REPOSITIONED for connector reality: the original brief implied a multi-product grid CATALOG, which is NOT connector-doable — document_merge_data_layout emits exactly ONE FILE PER ROW and cannot place several records on one page, and convert_pdf_to_indd output will not bind merge fields. So the client is modeled as needing what the merge tool genuinely produces: a per-SKU wholesale LINE SHEET (one letter-size single-record sell sheet per product) for the sales binder. The client supplies a genuinely hand-authored InDesign single-record line-sheet template (.indd, NOT a converted PDF) carrying live <<fields>> and TWO @-prefixed image-path columns (one for the product photo, one for the masthead wordmark), the roster as a CSV, ten raw product photos shot across two sessions under mismatched light with a photographic 18% grey card laid in frame, and a flat wordmark scan on off-white stock. The Adobe chain does the real work the brief rewards: neutralize every photo to its own in-frame grey card so the whole set shares one white point, hold a house warmth without wrecking any product's true color, recolor the holiday gift-box ribbon for a seasonal colorway without a reshoot, prep-and-vectorize the scanned wordmark, then run the authored template through a one-file-per-row data-merge and export a press-ready PDF per SKU.", "full_brief": "Thornfield & Rye Bakehouse sells to cafes and grocers wholesale and needs a per-product sell sheet for its distributor binder — one clean letter-size sheet per SKU, each carrying the product's name, code, description, case pack, and wholesale price alongside a high-quality photo, with the bakehouse wordmark crisp at the top. We are NOT reshooting. We are handing you ten existing product photos, and here is the problem: they were shot over two mornings under different light — some under cool fluorescents, some under warm window light, a couple underexposed, one overexposed — so straight out of the folder they look like a mismatched jumble, and a binder of mismatched shots reads cheap. To make this checkable we laid a photographic 18% grey card into the corner of every shot. Your job on the photos: bring every image to a consistent, true-to-product look by neutralizing each one to the grey card it contains — the card must read as a clean neutral grey (equal across the channels) in your finished frame, and once every card is neutral the whole set will share one white point. Hold a subtle warm bakehouse feel in the final look, but do NOT force one blanket correction across the batch: each photo was lit differently and needs its own white-balance, exposure, and tone decision to land on the shared target. Be careful — at least one product is genuinely golden (the butter croissant is supposed to look warm and brown); if its grey card already reads neutral, do not 'cool' it chasing an imagined blue cast, or you will strip the color the client is selling. When you are done, tell us the final white-balance and exposure moves you made on each frame so we can confirm they are matched, not eyeballed. Second, a color variant without a reshoot: on the holiday gift-box hero, our ribbon is currently a bright red — give us a deeper seasonal oxblood/burgundy version of the same shot (a rich, dark wine-red in the SAME color family, just deepened and slightly muted — not a jump to a far-off hue), and the recolor has to sit under the real folds, highlights and shadows of the ribbon. No flat dead-fill color, no whole-image tint that bleeds onto the box and the baked goods — just the ribbon, with its sheen and shadow intact. Third, our wordmark only exists as a flat scan on off-white paper — get it clean and razor-sharp for the sheet header (it must not look like a fuzzy scan when printed). Finally, build the sheets: we have hand-built the InDesign line-sheet template with the real placeholder fields and two image slots (one for the product photo, one for the wordmark at the top of the sheet), and we are giving you the roster; merge them so every SKU gets its own single-page sheet with its copy bound, its matching graded photo dropped in, and the crisp wordmark dropped into the masthead, then hand back one press-ready ~300 DPI US Letter PDF covering every SKU (one page per SKU, the Holiday Gift Box hero simply among them). Bind the copy verbatim from the roster — do not rewrite our descriptions or prices. Acceptance: every grey card neutral (channel spread within a hair of zero) and the whole set matched to one white point; the ribbon recolor natural under the existing light; the wordmark crisp vector; and exactly one finished sheet per roster row.", "inputs": [{"name": "thornfield_linesheet_template.indd", "kind": "data", "gen_model": "n/a-authored-asset", "gen_prompt": "AUTHORED DELIVERABLE (cannot be model-generated): a genuine, hand-built Adobe InDesign document (.indd/.idml) for a SINGLE-RECORD US Letter (8.5x11) portrait wholesale line sheet — ONE product per page. It must contain live InDesign data-merge placeholder fields <<product_name>>, <<sku>>, <<description>>, <<case_pack>>, <<wholesale_price>>, and TWO @-prefixed image-path merge columns wired to two separate image frames: a product image frame bound to @image (the matching graded photo), and a masthead image frame at the top of the sheet bound to @Wordmark (the vectorized bakehouse wordmark). Because free-form image-at-coordinates placement is banned, the wordmark reaches the masthead ONLY as a merge bind through this second image frame — it is not dropped in by hand. Built by hand in InDesign so the merge fields and BOTH image fields actually bind. Explicitly NOT a convert_pdf_to_indd output and NOT a multi-record grid: document_merge_data_layout emits one file per row, so the template holds exactly one record's worth of fields; a converted-PDF template or a multi-up grid would not bind / cannot be produced.", "realism_notes": "document_merge_data_layout is [T] and REQUIRES a user-authored .indd carrying real merge fields plus genuine @image-path columns, and it produces ONE FILE PER ROW — so a single-record line sheet is the correct, connector-doable shape. Supplied as an input, not a chain output; a PDF-converted .indd with literal typed text would not bind. TWO image columns (@image, @Wordmark) mean the merge resolves two prepped assets per row — the row's graded product photo AND the shared vectorized wordmark — so the chain-produced wordmark has a real, connector-doable path onto every sheet without any free-form placement."}, {"name": "thornfield_wholesale_roster.csv", "kind": "data", "gen_model": "gemini-2.5-flash", "gen_prompt": "Generate a CSV with columns product_name,sku,description,case_pack,wholesale_price,@image,@Wordmark holding 10 wholesale bakery rows, one per SKU: Country Sourdough Boule, Seeded Deli Rye, Rustic Baguette, Butter Croissant, Pain au Chocolat, Cinnamon Morning Roll, Rosemary Focaccia, Holiday Gift Box, Vanilla Bean Shortbread, Pistachio Macaron Box. Each row carries a keyword-rich one-to-two-line B2B product description, a SKU code (e.g. TR-BRD-014), a case-pack quantity (e.g. 'Case of 12'), and a US-dollar wholesale price (e.g. $28.00 / case). The @image column names the matching prepped photo file (e.g. @sourdough_graded.jpg) so the [T] merge drops each graded photo into that row's single-record sheet. The @Wordmark column holds the SAME vectorized wordmark file — @thornfield_wordmark.svg — in EVERY row, so the merge drops the one shared masthead mark onto every SKU's sheet as a merge bind (never free-form placement). Column names must exactly match the template merge fields <<product_name>>,<<sku>>,<<description>>,<<case_pack>>,<<wholesale_price>> and the two @image-path columns @image and @Wordmark.", "realism_notes": "Honors the brief's 'comprehensive product descriptions' + 'detailed pricing'; headers match the authored .indd fields and BOTH @-image columns so the one-file-per-row [T] merge binds copy, the correct photo, AND the shared wordmark per SKU. @Wordmark carries the identical vectorized SVG path in all ten rows, giving the chain-produced wordmark a connector-doable path onto every sheet via the merge (mirrors AO-75's two-image-column pattern). Ten rows => the merge must produce exactly ten finished sheets."}, {"name": "raw_product_photos_x10.zip", "kind": "image", "gen_model": "real-camera-capture", "gen_prompt": "A set of 10 REAL full-frame DSLR/mirrorless camera captures of wholesale bakery products, each ~4000-4500 px on the long edge (full-resolution stills straight off the camera, roughly 4000x4000 or larger before crop), each with a photographic 18% grey card laid flat in one corner of the frame as a neutral reference. Shot across two mornings under mismatched light: (1) round country sourdough boule, cool bluish fluorescent cast, frame tilted ~4 deg; (2) dark seeded deli rye loaf, cool cast, level; (3) rustic baguette, near-neutral light but frame tilted ~3 deg; (4) flaky butter croissant that is GENUINELY deep golden-brown, shot under near-neutral light so its grey card already reads neutral (the warmth is the real product, not a white-balance error); (5) pain au chocolat under warm tungsten light, tilted ~3 deg; (6) glazed cinnamon morning roll, warm window light, level; (7) rosemary focaccia, cool cast, tilted ~4 deg; (8) a holiday gift box of assorted bakes tied with a bright RED satin ribbon, mixed window+warm light, level (hero for the ribbon recolor); (9) vanilla bean shortbread rounds, flat and underexposed; (10) a box of pistachio macarons, slightly overexposed and warm. Every shot has real crumb/crust/glaze/fabric texture, cluttered bakery-counter surroundings, candid documentary feel, no studio gloss, no CGI. The grey card is clearly visible and uncropped in each.", "realism_notes": "REAL-CAMERA capture at ~4000-4500 px long edge (NOT an AI-gen ~1024-1536 px raster) precisely so each 1:1 square crop can fill the line-sheet image frame at ~300 DPI by DOWNSCALE ONLY — no upscaling anywhere in the chain. Deliberately mismatched (per-frame WB, exposure, and tilt vary) so a single blanket correction cannot fix the set — each frame needs its own decision. The in-frame 18% grey card is the free, checkable neutral target. Photo 4 is the trap: its warmth is real product color and its card is already neutral, so cooling it is wrong. Photo 8 carries the red ribbon for the masked recolor. Delivered as a zip of 10 individually addressable full-resolution JPEGs."}, {"name": "thornfield_wordmark_scan.png", "kind": "image", "gen_model": "gemini-3-pro-image", "gen_prompt": "A flat desktop scan of the 'Thornfield & Rye Bakehouse' wordmark inked on off-white textured paper: a warm hand-lettered serif with a small wheat-sheaf mark, deep espresso-brown letters. Rendered as a scan — the paper is a slightly warm off-white (NOT transparent, NOT pure white), the whole thing sits very slightly rotated (~2 deg) on the scan bed, there is extra paper margin around the mark, and edges are a touch soft as a real scan would be. High enough contrast that, once cleaned, it will vectorize cleanly.", "realism_notes": "Scanned-on-paper (off-white ground, slight rotation, margin, soft edges) so image_vectorize would trace the paper and the skew if fed raw — forcing genuine prep-before-trace: straighten, boost contrast/crispness, crop to the mark, knock the off-white ground to transparency, THEN vectorize. gemini-3-pro-image for clean legible lettering."}], "outputs": [{"name": "Thornfield_LineSheets_perSKU_x10.pdf", "kind": "pdf", "spec": "Exactly ten press-ready US Letter (8.5x11) portrait line sheets — ONE single-record sheet per roster row (page-count = row-count = 10) — exported from the one-file-per-row InDesign data-merge; each sheet binds its product_name/sku/description/case_pack/wholesale_price verbatim from the roster with its matching grey-card-neutralized 1:1 photo dropped into the product image frame (via @image) and the vectorized wordmark dropped into the masthead image frame (via @Wordmark) — both by merge bind, never free-form placement; ~300 DPI print quality."}, {"name": "graded_product_photos_x10", "kind": "image", "spec": "Ten grey-card-neutralized, straightened bakery product photos, delivered as the product-framed 1:1 crops (grey card cropped OUT) that bind into the merge, alongside their RETAINED pre-crop neutralized masters (the *_neutralized full-res frames, grey card still in frame) which the harness keeps as the neutrality-grading artifacts. Acceptance (grader-checked, two SEPARATE claims): (a) neutralisation is graded on the RETAINED pre-crop neutralized master of each frame (the *_neutralized output, its in-frame 18% grey card still present) — the card region reads a clean neutral (per-channel spread near zero) with the whole set matched to one shared white point while holding a subtle warm bakehouse tone, and true-to-product (no product's genuine color forced off); (b) card-exclusion is checked separately on each delivered product-framed 1:1 crop (the *_graded output that binds into that SKU's sheet) — it is framed on the product with the grey card fully cropped OUT (no card pixels present). The neutrality tolerance is never evaluated on the product crop. Accompanied by a report of the final white-balance and exposure move applied to each frame."}, {"name": "variant_giftbox_ribbon_burgundy.jpg", "kind": "image", "spec": "Recolored variant of the Holiday Gift Box hero: the bright red satin ribbon deepened to the seasonal oxblood/burgundy house color via a masked, luminosity-preserving image_adjust_hsl pass pair (a small within-family hue nudge plus a saturation/luminance drop that darkens and mutes the red — an in-band adjacent shift, no near-complementary rotation) riding the ribbon's existing luminosity, so its folds, sheen highlights and cast shadow stay natural and the box and baked goods are untouched — no whole-image overlay, no flat fill."}, {"name": "thornfield_wordmark.svg", "kind": "vector", "spec": "Clean vector SVG of the wordmark, traced only after the scan is straightened, crisped, cropped to the mark, and knocked to transparency — razor-sharp at masthead scale with no captured paper ground or skew."}], "workflow": [{"n": 1, "tool": "image_auto_straighten", "server": "adobe", "exec_mode": "C", "inputs_from": "raw_product_photos_x10.zip#01_sourdough", "output": "sourdough_straight", "note": "Triage: this frame is tilted ~4 deg, so level it first. (Only the tilted frames 1/3/5/7 get straightened; the level frames skip this — deciding which is part of the job.)"}, {"n": 2, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "sourdough_straight", "output": "sourdough_neutralized", "note": "Cool bluish cast: WARM it (positive temperature) and set tint until the in-frame 18% grey card reads neutral (R=G=B), then set exposure/highlights/shadows so the card sits at mid-grey and hold a subtle warm bakehouse tone with a touch of vibrance/clarity. Reason the exact temperature/exposure to the card — do NOT reuse another frame's numbers. Report the final move. Single primitive-built adjustments call (replaces the deprecated image_adjust_color_temperature / _vibrance_and_saturation)."}, {"n": 3, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "sourdough_neutralized", "output": "sourdough_graded", "note": "Crop the neutralized frame to the 1:1 square the line-sheet image frame expects, framing on the product with the grey card cropped OUT — this product crop (card removed) is what binds into the sheet. The pre-crop neutralized master (sourdough_neutralized, grey card still in frame) is RETAINED by the harness as the neutrality-grading artifact; the card's neutrality is graded THERE, never on this product crop, and card-exclusion is the separate check on this crop. onSubjectClipping='extract', downscale-only, never generative-expand."}, {"n": 4, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "raw_product_photos_x10.zip#02_rye", "output": "rye_neutralized", "note": "Level frame, cool cast: warm to neutralize its grey card and match the shared white point established on frame 1; rye is dark, so lift shadows carefully without crushing. Distinct numbers from frame 1 because the light differed. Report the move."}, {"n": 5, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "rye_neutralized", "output": "rye_graded", "note": "Crop to the 1:1 line-sheet frame. onSubjectClipping='extract', downscale-only."}, {"n": 6, "tool": "image_auto_straighten", "server": "adobe", "exec_mode": "C", "inputs_from": "raw_product_photos_x10.zip#03_baguette", "output": "baguette_straight", "note": "Tilted ~3 deg — level it."}, {"n": 7, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "baguette_straight", "output": "baguette_neutralized", "note": "Near-neutral light: its grey card is close to neutral, so only a small WB nudge is needed to land on the shared white point — over-correcting would push it off the set. Set exposure to match set brightness, hold the warm tone. Report the (small) move."}, {"n": 8, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "baguette_neutralized", "output": "baguette_graded", "note": "Crop to the 1:1 line-sheet frame. onSubjectClipping='extract', downscale-only."}, {"n": 9, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "raw_product_photos_x10.zip#04_croissant", "output": "croissant_neutralized", "note": "THE TRAP FRAME. The croissant is genuinely deep golden-brown and it was shot under near-neutral light, so its in-frame grey card ALREADY reads neutral. The correct move is essentially NO white-balance shift (only match exposure/brightness to the set). A naive agent that batch-applies the same 'warm the cool cast' correction used on frames 1/2/7, or that 'cools an imagined blue cast', will neutralize the card off-neutral and strip the product's real color. Decision must be driven by THIS card, not the batch. Report that WB was held."}, {"n": 10, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "croissant_neutralized", "output": "croissant_graded", "note": "Crop to the 1:1 line-sheet frame. onSubjectClipping='extract', downscale-only."}, {"n": 11, "tool": "image_auto_straighten", "server": "adobe", "exec_mode": "C", "inputs_from": "raw_product_photos_x10.zip#05_pain_au_chocolat", "output": "pac_straight", "note": "Tilted ~3 deg under warm tungsten — level it."}, {"n": 12, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "pac_straight", "output": "pac_neutralized", "note": "Warm tungsten cast: this frame must move the OPPOSITE direction from the cool frames — COOL it (negative temperature) until its grey card reads neutral and it matches the shared white point. Adaptive: the batch is not uniformly cool, so a blanket 'warm everything' pass fails here. Report the move."}, {"n": 13, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "pac_neutralized", "output": "pac_graded", "note": "Crop to the 1:1 line-sheet frame. onSubjectClipping='extract', downscale-only."}, {"n": 14, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "raw_product_photos_x10.zip#06_cinnamon_roll", "output": "cinnamon_neutralized", "note": "Warm window light, level: cool toward neutral against its grey card to the shared white point; protect the glaze highlights from clipping. Report the move."}, {"n": 15, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "cinnamon_neutralized", "output": "cinnamon_graded", "note": "Crop to the 1:1 line-sheet frame. onSubjectClipping='extract', downscale-only."}, {"n": 16, "tool": "image_auto_straighten", "server": "adobe", "exec_mode": "C", "inputs_from": "raw_product_photos_x10.zip#07_focaccia", "output": "focaccia_straight", "note": "Tilted ~4 deg, cool cast — level it."}, {"n": 17, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "focaccia_straight", "output": "focaccia_neutralized", "note": "Cool cast: warm to neutralize its grey card to the shared white point; keep the rosemary green true (don't oversaturate). Report the move."}, {"n": 18, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "focaccia_neutralized", "output": "focaccia_graded", "note": "Crop to the 1:1 line-sheet frame. onSubjectClipping='extract', downscale-only."}, {"n": 19, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "raw_product_photos_x10.zip#08_giftbox", "output": "giftbox_neutralized", "note": "Hero. Mixed window+warm light: neutralize its grey card to the shared white point (a modest correction). This graded full-res frame feeds BOTH the 1:1 crop for the sheet AND the ribbon-recolor branch, so keep it before cropping. Report the move."}, {"n": 20, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "giftbox_neutralized", "output": "giftbox_graded", "note": "Crop the neutralized hero to the 1:1 line-sheet frame (the red-ribbon version that binds into the Holiday Gift Box sheet). onSubjectClipping='extract', downscale-only."}, {"n": 21, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "raw_product_photos_x10.zip#09_shortbread", "output": "shortbread_neutralized", "note": "Flat and underexposed: LIFT exposure and add contrast/clarity, then neutralize its grey card to the shared white point. The dominant move here is tonal, not WB — different problem from the cool/warm frames. Report the move."}, {"n": 22, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "shortbread_neutralized", "output": "shortbread_graded", "note": "Crop to the 1:1 line-sheet frame. onSubjectClipping='extract', downscale-only."}, {"n": 23, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "raw_product_photos_x10.zip#10_macaron", "output": "macaron_neutralized", "note": "Overexposed and warm: PULL exposure/highlights down to recover the blown box, then cool to neutralize its grey card to the shared white point. Opposite tonal AND WB direction from frame 9 — proving the batch needs per-frame reasoning. Report the move."}, {"n": 24, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "macaron_neutralized", "output": "macaron_graded", "note": "Crop to the 1:1 line-sheet frame. onSubjectClipping='extract', downscale-only. Frames 1-10 now share one white point, each neutralized to its own grey card."}, {"n": 25, "tool": "image_select_by_prompt", "server": "adobe", "exec_mode": "C", "inputs_from": "giftbox_neutralized", "output": "ribbon_mask", "note": "On the graded full-res hero, semantically select only the red satin ribbon ('the red satin ribbon tied around the gift box'). Isolates the recolor to the part so the box and baked goods are untouched. Returns a maskURI. Not a hue/coordinate selection — a real object."}, {"n": 26, "tool": "image_adjust_hsl", "server": "adobe", "exec_mode": "C", "inputs_from": "giftbox_neutralized, ribbon_mask", "output": "ribbon_hue_shifted", "note": "Masked recolor pass 1 (consumes hero + ribbon mask): keep the ribbon in the red family but deepen it toward oxblood — a small within-band hue nudge (well under ~60 deg, staying in red/wine; NOT a near-complementary rotation) together with a luminance drop that darkens the satin, letting the ribbon's existing luminosity carry the folds, sheen highlights and cast shadow. Confined to the mask. image_adjust_hsl is the ONLY masked recolor path; image_apply_color_overlay is whole-image (would tint the whole box) and image_fill_area is flat solid dead-fill (kills the satin sheen) — both are wrong here."}, {"n": 27, "tool": "image_adjust_hsl", "server": "adobe", "exec_mode": "C", "inputs_from": "ribbon_hue_shifted, ribbon_mask", "output": "ribbon_burgundy_fullres", "note": "Masked recolor pass 2 (same mask): trim the red-band saturation and settle the luminance so the ribbon lands on the rich oxblood/burgundy house target instead of a flat brick or a still-bright candy red, still riding the original luminosity so the satin sheen and shadow stay natural. A deepen-and-mute in the same hue family, not a swing to a new hue."}, {"n": 28, "tool": "image_crop_and_resize", "server": "adobe", "exec_mode": "C", "inputs_from": "ribbon_burgundy_fullres", "output": "variant_giftbox_ribbon_burgundy.jpg", "note": "Resize the finished oxblood/burgundy ribbon variant to the same web/sheet frame as the set. onSubjectClipping='extract', downscale-only."}, {"n": 29, "tool": "image_auto_straighten", "server": "adobe", "exec_mode": "C", "inputs_from": "thornfield_wordmark_scan.png", "output": "wordmark_deskewed", "note": "Prep-before-trace step 1: the scan sits ~2 deg rotated on the bed — straighten so the vector edges are square. Feeding the raw skewed scan to vectorize would bake in the rotation."}, {"n": 30, "tool": "image_apply_adjustments", "server": "adobe", "exec_mode": "C", "inputs_from": "wordmark_deskewed", "output": "wordmark_crisped", "note": "Prep-before-trace step 2: push contrast/clarity and drop the off-white paper toward white so the espresso lettering separates hard from the ground — a soft low-contrast scan traces into ragged, doubled edges."}, {"n": 31, "tool": "image_crop_to_bounds", "server": "adobe", "exec_mode": "C", "inputs_from": "wordmark_crisped", "output": "wordmark_cropped", "note": "Prep-before-trace step 3: crop away the scan margin to the tight bounds of the mark so vectorize traces only the wordmark, not the paper field."}, {"n": 32, "tool": "image_remove_background", "server": "adobe", "exec_mode": "C", "inputs_from": "wordmark_cropped", "output": "wordmark_knockout", "note": "Prep-before-trace step 4: knock the off-white paper ground to transparency so the trace captures the letterforms only, not a rectangle of paper. remove_background -> transparency (NOT select->invert->fill)."}, {"n": 33, "tool": "image_vectorize", "server": "adobe", "exec_mode": "C", "inputs_from": "wordmark_knockout", "output": "thornfield_wordmark.svg", "note": "Now trace the prepared raster (straightened, crisped, cropped, transparent) into a clean SVG for the masthead. Tracing the raw scan instead would produce a skewed, paper-bounded, fuzzy silhouette — the trap this prep chain avoids."}, {"n": 34, "tool": "asset_initialize_file_upload", "server": "adobe", "exec_mode": "C", "inputs_from": "sourdough_graded, rye_graded, baguette_graded, croissant_graded, pac_graded, cinnamon_graded, focaccia_graded, giftbox_graded, shortbread_graded, macaron_graded, thornfield_wordmark.svg", "output": "upload_session", "note": "Initialize an upload session for the ten grey-card-neutralized 1:1 photos plus the vector wordmark so the merge can resolve them by the @image column (per-row product photo) and the @Wordmark column (the shared masthead mark). Files uploaded under the exact names the roster references (e.g. thornfield_wordmark.svg for @Wordmark)."}, {"n": 35, "tool": "asset_finalize_file_upload", "server": "adobe", "exec_mode": "C", "inputs_from": "upload_session", "output": "uploaded_asset_urns", "note": "Finalize the upload; returns the asset URNs the roster's @image and @Wordmark columns resolve to — the per-SKU graded photo and the shared vectorized wordmark — for each single-record sheet's product frame and masthead frame."}, {"n": 36, "tool": "document_merge_data_layout", "server": "adobe", "exec_mode": "T", "inputs_from": "thornfield_linesheet_template.indd, thornfield_wholesale_roster.csv, uploaded_asset_urns", "output": "linesheets_merged_set", "note": "One-file-per-row InDesign data-merge: bind each of the ten roster rows (product_name/sku/description/case_pack/wholesale_price) into the authored SINGLE-RECORD .indd's live <<fields>> and resolve BOTH image columns per row — drop that row's graded photo into the @image product frame AND the vectorized wordmark (from @Wordmark, the same SVG in every row) into the masthead frame — producing EXACTLY ONE merged sheet per row (ten sheets). Binding the wordmark through the @Wordmark image column is what puts it on the sheet: free-form image-at-coordinates placement is banned, so the merge is its only connector-doable path. [T] requires the hand-authored template with its two merge-wired image frames. This is the correct shape for this tool — a multi-record grid catalog is impossible here, and a convert_pdf_to_indd template would not bind."}, {"n": 37, "tool": "document_render_layout", "server": "adobe", "exec_mode": "C", "inputs_from": "linesheets_merged_set", "output": "Thornfield_LineSheets_perSKU_x10.pdf", "note": "Export the merged single-record sheets to press-ready ~300 DPI US Letter PDF, one sheet per SKU. document_render_layout exports the WHOLE merged multi-page document (all ten sheets, one page per SKU) in a single call — it cannot export one named record on its own, so the Holiday Gift Box hero is simply one p
