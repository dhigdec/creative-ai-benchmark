<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gatsby | Pilot outputs | Deccan AI</title>
  <style>
    :root{color-scheme:light;--ink:#182724;--muted:#62736e;--line:#d7e0dc;--ground:#f6f9f7;--green:#166c53;--blue:#365675;--warning:#9b5d2c}
    *{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}button,a{font:inherit}button{cursor:pointer}a{color:var(--green)}
    header{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 28px;background:#fff;position:sticky;top:0;z-index:5}.brand{font-size:22px;font-weight:750;color:var(--ink);text-decoration:none;white-space:nowrap}.brand small{font-size:10px;vertical-align:top}.divider{width:1px;height:24px;background:var(--line)}.project{font-size:18px;font-weight:650}.sub{font-size:13px;color:var(--muted)}.top-link{margin-left:auto;text-decoration:none;font-size:13px;white-space:nowrap}
    .shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 70px)}aside{border-right:1px solid var(--line);background:var(--ground);padding:20px 14px;position:sticky;top:70px;height:calc(100vh - 70px);overflow:auto}.side-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:3px 10px 11px}.task-button{width:100%;text-align:left;border:0;border-left:3px solid transparent;background:transparent;padding:11px 11px 12px;margin-bottom:3px;display:flex;gap:10px;align-items:flex-start}.task-button:hover{background:#eaf2ee}.task-button[aria-current="true"]{background:#e2f0e9;border-left-color:var(--green)}.code{font:700 12px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--green);white-space:nowrap}.task-label{display:block;font-size:13px;color:var(--ink);font-weight:560;line-height:1.35}.task-count{display:block;color:var(--muted);font-size:11px;margin-top:4px}
    main{min-width:0;padding:28px 34px 70px;max-width:1600px;width:100%;margin:0 auto}.head{display:flex;align-items:flex-start;gap:20px;border-bottom:1px solid var(--line);padding-bottom:20px}.head h1{font-size:27px;line-height:1.16;margin:5px 0 8px;font-weight:680}.eyebrow{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--green)}.summary{color:var(--muted);font-size:13px}.status{margin-left:auto;white-space:nowrap;border:1px solid #b8d5c5;color:var(--green);background:#edf7f1;padding:5px 9px;font-size:12px;font-weight:650;border-radius:4px}.status.pending{border-color:#e7d2bd;color:var(--warning);background:#fff7ef}
    .links{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 24px}.link-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;padding:8px 11px;text-decoration:none;color:var(--ink);border-radius:4px;font-size:13px}.link-btn:hover{border-color:var(--green);color:var(--green)}.link-btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.link-btn.primary:hover{background:#0c5d46}
    .callout{border-left:3px solid var(--blue);background:#f1f6fa;padding:12px 15px;margin-bottom:22px;color:#344b60;font-size:13px}.callout strong{color:#20394d}.notes{padding:12px 15px;border-left:3px solid var(--warning);background:#fff8f2;margin:0 0 25px;font-size:13px}.notes p{margin:0 0 5px}.notes p:last-child{margin-bottom:0}
    .section-head{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}.section-head h2{font-size:17px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}.output{border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden;min-width:0}.preview{border:0;background:#eef2ef;width:100%;height:220px;display:block;padding:0}.preview img{width:100%;height:100%;object-fit:contain;display:block}.output-body{padding:12px 13px 14px}.output h3{font-size:14px;line-height:1.35;margin:0 0 4px;font-weight:650}.file{color:var(--muted);font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.actions{display:flex;gap:8px;margin-top:13px}.actions a,.actions button{background:#fff;border:1px solid var(--line);color:var(--green);text-decoration:none;padding:6px 9px;border-radius:4px;font-size:12px}.actions a:hover,.actions button:hover{border-color:var(--green)}.empty{padding:35px 5px;color:var(--muted)}
    dialog{border:0;border-radius:6px;padding:0;width:min(1100px,94vw);height:min(900px,92vh);box-shadow:0 20px 60px #0004}dialog::backdrop{background:#10231fc7}.viewer-head{height:50px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line)}.viewer-head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.viewer-head a{margin-left:auto;font-size:12px}.viewer-head button{border:0;background:transparent;font-size:22px;line-height:1;padding:4px 8px}.viewer-body{height:calc(100% - 50px);display:grid;place-items:center;background:#e6ebe8}.viewer-body img,.viewer-body iframe{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;border:0}
    @media(max-width:800px){header{padding:0 14px;height:62px}.project{font-size:16px}.sub{display:none}.shell{display:block}aside{position:static;height:auto;display:flex;overflow:auto;gap:5px;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px}.side-title{display:none}.task-button{min-width:180px;margin:0}.task-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}main{padding:20px 16px 50px}.head h1{font-size:22px}.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.preview{height:160px}.top-link{font-size:12px}}
  </style>
</head>
<body>
  <header><a class="brand" href="../">Deccan<small>AI</small></a><div class="divider"></div><div class="project">Gatsby</div><div class="sub">V7 pilot outputs</div><a class="top-link" href="../">100-task review ↗</a></header>
  <div class="shell"><aside><div class="side-title">Pilot tasks</div><nav id="task-list" aria-label="Pilot tasks"></nav></aside><main id="content"></main></div>
  <dialog id="viewer"><div class="viewer-head"><strong id="viewer-title"></strong><a id="viewer-open" target="_blank" rel="noopener">Open file ↗</a><button id="viewer-close" aria-label="Close preview">×</button></div><div class="viewer-body" id="viewer-body"></div></dialog>
  <script src="data.js"></script>
  <script>
    const tasks=window.PILOT_DATA||[];const list=document.querySelector('#task-list');const content=document.querySelector('#content');const viewer=document.querySelector('#viewer');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function renderList(active){list.innerHTML=tasks.map(t=>`<button class="task-button" data-task="${esc(t.code)}" aria-current="${t.code===active}"><span class="code">${esc(t.code)}</span><span><span class="task-label">${esc(t.title)}</span><span class="task-count">${t.outputs.length} / ${t.expected} outputs</span></span></button>`).join('');list.querySelectorAll('button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.task});}
    function render(){const code=decodeURIComponent(location.hash.slice(1));const t=tasks.find(x=>x.code===code)||tasks[0];if(!t)return;renderList(t.code);document.title=`${t.code} | Gatsby pilot | Deccan AI`;const links=[`<a class="link-btn" href="${esc(t.brief_url)}">Full task brief ↗</a>`];if(t.trajectory_url)links.push(`<a class="link-btn primary" href="${esc(t.trajectory_url)}">View trajectory ↗</a>`);if(t.drive_url)links.push(`<a class="link-btn" href="${esc(t.drive_url)}" target="_blank" rel="noopener">Drive folder ↗</a>`);const notes=t.notes.length?`<div class="notes"><strong>Production notes</strong>${t.notes.map(n=>`<p>${esc(n)}</p>`).join('')}</div>`:'';content.innerHTML=`<div class="head"><div><div class="eyebrow">${esc(t.code)} · ${esc(t.family)}</div><h1>${esc(t.title)}</h1><div class="summary">${t.outputs.length} of ${t.expected} deliverables available · ${esc(t.execution)}</div></div><span class="status ${t.status==='Delivered'?'':'pending'}">${esc(t.status)}</span></div><div class="links">${links.join('')}</div><div class="callout"><strong>Delivery record.</strong> File availability is separate from independent creative approval. Open a task's trajectory for the Adobe calls, choices, previews, and disclosed limitations.</div>${notes}<div class="section-head"><h2>Deliverables</h2><span>${t.outputs.length} files</span></div>${t.outputs.length?`<div class="grid">${t.outputs.map((o,i)=>`<article class="output"><button class="preview" data-preview="${i}" aria-label="Preview ${esc(o.name)}"><img src="${esc(o.preview)}" alt="Preview of ${esc(o.name)}" loading="lazy"></button><div class="output-body"><h3>${esc(o.name)}</h3><div class="file">${esc(o.file)} · ${esc(o.format.toUpperCase())} · ${o.size_mb} MB</div><div class="actions"><button data-preview="${i}">Preview</button><a href="${esc(o.url)}" target="_blank" rel="noopener">Open ↗</a><a href="${esc(o.url)}" download>Download ↓</a></div></div></article>`).join('')}</div>`:'<div class="empty">This run has not produced deliverables yet.</div>'}`;content.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>show(t.outputs[Number(b.dataset.preview)]));}
    function show(o){document.querySelector('#viewer-title').textContent=o.name;const open=document.querySelector('#viewer-open');open.href=o.url;const body=document.querySelector('#viewer-body');body.innerHTML=o.format==='pdf'?`<iframe src="${esc(o.url)}#toolbar=0" title="${esc(o.name)}"></iframe>`:`<img src="${esc(o.url)}" alt="${esc(o.name)}">`;viewer.showModal();}
    document.querySelector('#viewer-close').onclick=()=>viewer.close();viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});window.addEventListener('hashchange',render);if(!location.hash&&tasks.length)location.hash=tasks[0].code;render();
  </script>
</body>
</html>
