<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gatsby V6 | Deccan AI</title>
  <link rel="stylesheet" href="review.css">
  <script defer src="catalog.js"></script>
  <script defer src="review.js"></script>
</head>
<body>
  <header class="site-header">
    <img src="deccan-logo.png" alt="Deccan AI" width="160" height="46">
    <div class="brand-title"><strong>Gatsby</strong><span>V6 task review</span></div>
    <nav class="header-links" aria-label="Editions and downloads">
      <a href="../gatsby-v5/">Original V5</a>
      <a href="ALL100_TASKS.zip" download>100-task JSON ZIP</a>
      <a href="CHANGES_ALL100.md">Revision log</a>
    </nav>
  </header>
  <div class="workspace">
    <aside>
      <label for="search">Task or client</label><input id="search" type="search" placeholder="Search 100 tasks">
      <label for="family">Family</label><select id="family"><option value="">All families</option></select>
      <p id="count">Loading task catalog...</p>
      <nav id="tasks" aria-label="Task list"></nav>
    </aside>
    <main id="main">
      <div class="edition-note"><strong>V6 contracts · separate edition</strong><span>V5 is preserved. Revised tasks have not been executed or independently rated.</span></div>
      <div id="heading"></div>
      <div id="tabs" role="tablist" aria-label="Task sections"></div>
      <div id="content" role="tabpanel"></div>
      <noscript>This catalog requires JavaScript. The complete task JSON and revision log are available above.</noscript>
    </main>
  </div>
</body>
</html>
