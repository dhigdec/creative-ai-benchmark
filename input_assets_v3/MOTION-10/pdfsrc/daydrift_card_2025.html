<title>DAYDRIFT Episode Card 2025</title>
<style>
  /* A6 portrait, media box = trim, NO bleed */
  @page { size: 105mm 148mm; margin: 0; }
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .card {
    position: relative;
    width: 105mm;
    height: 148mm;
    background: #EDE4D3;                 /* Foam Cream ground */
    overflow: hidden;
    font-family: 'Helvetica Neue', Arial, sans-serif;   /* quiet humanist sans */
    color: #2B2B2E;                       /* Slate Ink */
  }

  /* ONE continuous text story carrying every line (episode no. -> title ->
     guest credit -> date -> hairline -> sponsor). Not five addressable frames:
     one text frame, lines separated only by breaks. */
  .story {
    position: absolute;
    top: 9mm;
    left: 9mm;
    right: 9mm;
  }
  .story .eyebrow {
    font-family: Georgia, 'Times New Roman', serif;   /* warm humanist serif */
    font-size: 11.5pt;
    letter-spacing: 0.3pt;
    color: #3A2E26;                       /* Deep Room Brown */
    margin: 0 0 2.4mm 0;
  }
  .story .title {
    font-family: Georgia, 'Times New Roman', serif;   /* warm humanist serif */
    font-weight: 400;
    font-size: 25pt;
    line-height: 1.05;
    color: #3A2E26;                       /* Deep Room Brown */
    margin: 0 0 3.6mm 0;
  }
  .story .guest {
    font-size: 10.5pt;
    color: #2B2B2E;                       /* Slate Ink */
    margin: 0 0 1.3mm 0;
  }
  .story .date {
    font-size: 8.5pt;
    letter-spacing: 0.2pt;
    color: #7C8471;                       /* Muted Sage minor accent */
    margin: 0;
  }
  .story .rule {
    height: 0;
    width: 34mm;
    border: 0;
    border-top: 0.6pt solid #C68A4E;      /* Lamplight Amber hairline rule */
    margin: 3.4mm 0 3.2mm 0;
  }
  .story .sponsor {
    font-size: 8pt;
    line-height: 1.42;
    color: #2B2B2E;                       /* Slate Ink */
    max-width: 82mm;
  }

  /* One large picture window filling the bottom of the card, carrying a REAL
     placed photograph (a graphic frame), with a thin Lamplight Amber keyline. */
  .window {
    position: absolute;
    left: 9mm;
    right: 9mm;
    bottom: 9mm;
    height: 60mm;
    border: 0.75pt solid #C68A4E;         /* Lamplight Amber keyline */
    background: #EDE4D3;                   /* Foam Cream fill behind the image */
    overflow: hidden;
  }
  .window img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
