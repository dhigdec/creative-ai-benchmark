<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harborline Realty - Weekly Listing Sheet (2025 press proof)</title>
<!--
  Faithful re-author of the retired printer's flat press PDF for LAYOUT-21.
  Document: US LETTER PORTRAIT, single record, media box = trim (NO bleed box).
  One placed hero photograph (real graphic frame for convert_pdf_to_indd).
  Embedded faces in the real file: 'Harborline Text' (transitional serif) and
  'Coastline Sans' (humanist sans). Here mapped to Georgia/Times and Arial/Helvetica;
  Chrome print-to-PDF embeds the subsets actually used.

  STRUCTURAL TRAP baked exactly as the layout spec's "how it is actually set":
    DESCRIPTION + BEDS/BATHS/SQ FT strip + PRICE + REFERENCE CODE are ONE continuous
    text story in a SINGLE frame (.story), run order description -> strip -> price ->
    ref code. ADDRESS, HEADLINE and AGENT each sit in their own standalone frame.
    DESCRIPTION lives in a FIXED ~3-line measure (10.5/13.5 pt, no auto-grow):
    overflow is clipped so a longer string oversets silently.
  Real single record = weekly_active.csv row for 42 Birch Ln (REF HL-25-0148),
  the short 2025-book entry this fixed measure was built around.
-->
<style>
  @page { size: 215.9mm 279.4mm; margin: 0; }          /* US Letter portrait, media box = trim, no bleed */
  html, body { margin: 0; padding: 0; }

  :root{
    --cream:#F4ECDD;   /* ground */
    --navy:#12324A;    /* Deep Harbour Navy - headline / description / price */
    --rope:#B48A54;    /* Weathered Rope Tan - hairline rules */
    --slate:#5C6E74;   /* Sea Slate - address / strip / agent / reference code */
    --buoy:#A6392E;    /* Buoy Red - thin rule under the price */
    --serif: Georgia, 'Times New Roman', 'Times', serif;              /* Harborline Text */
    --sans: 'Helvetica Neue', Arial, Helvetica, 'Liberation Sans', sans-serif; /* Coastline Sans */
  }

  .sheet{
    position: relative;
    box-sizing: border-box;
    width: 215.9mm;
    height: 279.4mm;
    background: var(--cream);
    padding: 20mm 19mm 0 19mm;
    display: flex;
    flex-direction: column;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* --- ADDRESS (standalone frame) --- */
  .address{
    font-family: var(--sans);
    font-variant: small-caps;
    font-weight: 500;
    font-size: 11pt;
    letter-spacing: 0.14em;
    color: var(--slate);
    white-space: nowrap;
    overflow: hidden;
    margin: 0 0 5mm 0;
  }

  /* --- HEADLINE (standalone frame) --- */
  .headline{
    font-family: var(--serif);
    font-weight: 400;
    font-size: 25pt;
    line-height: 1.12;
    color: var(--navy);
    margin: 0 0 7mm 0;
  }

  /* --- HERO PHOTOGRAPH (placed graphic frame; reads as a wide letterbox band) --- */
  .hero{
    width: 100%;
    height: 92mm;
    overflow: hidden;
    background: var(--slate);
    margin: 0 0 8mm 0;
  }
  .hero img{
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;          /* centre-anchored fill, mirrors the frame's fitting */
    object-position: center center;
  }

  /* --- CONTINUOUS STORY (single text frame): description -> strip -> price -> ref code --- */
  .story{
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* DESCRIPTION sub-run: fixed 3-line measure, no auto-grow, oversets silently */
  .story .desc{
    font-family: var(--serif);
    font-size: 10.5pt;
    line-height: 13.5pt;
    color: var(--navy);
    height: 40.5pt;             /* 3 x 13.5pt leading */
    overflow: hidden;
    margin: 0 0 7mm 0;
    max-width: 150mm;
  }

  /* BEDS / BATHS / SQ FT strip, hairline Weathered Rope Tan rules */
  .story .strip{
    font-family: var(--sans);
    font-variant: small-caps;
    font-size: 10.5pt;
    letter-spacing: 0.10em;
    color: var(--slate);
    display: flex;
    align-items: center;
    margin: 0 0 8mm 0;
  }
  .story .strip span{ white-space: nowrap; }
  .story .strip .rule{
    display: inline-block;
    width: 0;
    height: 12pt;
    border-left: 0.5pt solid var(--rope);
    margin: 0 5mm;
  }

  /* PRICE, large serif, thin Buoy Red rule beneath */
  .story .price{
    font-family: var(--serif);
    font-weight: 400;
    font-size: 26pt;
    line-height: 1;
    color: var(--navy);
    margin: 0;
  }
  .story .price .buoy{
    display: block;
    width: 30mm;
    height: 1.2pt;
    background: var(--buoy);
    margin-top: 3mm;
  }

  /* REFERENCE CODE line, foot of the same frame */
  .story .refcode{
    font-family: var(--sans);
    font-size: 7.5pt;
    letter-spacing: 0.18em;
    color: var(--slate);
    margin-top: auto;           /* pushed to the foot of the story frame */
    margin-bottom: 15mm;
  }

  /* --- AGENT (standalone frame), sits above the reference code --- */
  .agent{
    position: absolute;
    left: 19mm;
    bottom: 23mm;
    font-family: var(--sans);
    font-size: 10pt;
    letter-spacing: 0.05em;
    color: var(--slate);
    margin: 0;
  }
</style>
</head>
<body>
  <div class="sheet">

    <!-- ADDRESS : standalone frame -->
    <div class="address">42 Birch Ln, Rockland</div>

    <!-- HEADLINE : standalone frame -->
    <div class="headline">Corner-Lot Starter, Steps to the Harbor</div>

    <!-- HERO : placed photograph (real graphic frame) -->
    <div class="hero">
      <img src="file:///Users/dhiren/Downloads/Deccan/Adobe-Freelance-Leads/input_assets_v3/LAYOUT-21/assets/hero_select_05.jpg" alt="42 Birch Ln, Rockland">
    </div>

    <!-- CONTINUOUS STORY : one text frame, run order description -> strip -> price -> ref code -->
    <div class="story">
      <div class="desc">Tidy three-bed on a sunny corner lot, a short walk to the working harbour. New furnace, level yard, room to grow. Open Sunday, one to three.</div>
      <div class="strip"><span>3 Beds</span><span class="rule"></span><span>1 Bath</span><span class="rule"></span><span>1,100 Sq Ft</span></div>
      <div class="price">$320,000<span class="buoy"></span></div>
      <div class="refcode">REF HL-25-0148</div>
    </div>

    <!-- AGENT : standalone frame -->
    <div class="agent">Nora Beck</div>

  </div>
</body>
</html>
