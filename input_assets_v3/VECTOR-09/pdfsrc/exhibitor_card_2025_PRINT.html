<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halcyon Grid — Exhibitor Card 2025</title>
<style>
  /* Media box = trim, no bleed, no crop marks (89 x 51 mm landscape business card) */
  @page { size: 89mm 51mm; margin: 0; }
  html, body { margin: 0; padding: 0; }

  /* One card, exactly at trim. Sharp geometric grotesque, restrained,
     engineering-documentation feel. Slate-ink type on paper-white. */
  .card {
    position: relative;
    width: 89mm;
    height: 51mm;
    background: #F6F7FA;                 /* Paper White */
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: #1C2230;                      /* Slate Ink */
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Left third: portrait image frame (a real placed graphic frame) */
  .photo {
    position: absolute;
    left: 0;
    top: 0;
    width: 30mm;
    height: 51mm;
    overflow: hidden;
    background: #8A93A6;                 /* Cool Steel, shows if image absent */
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 28%;
    display: block;
  }

  /* Signal-violet rule dividing the portrait from the copy column */
  .rule {
    position: absolute;
    left: 30mm;
    top: 0;
    width: 0.9mm;
    height: 51mm;
    background: #6C4BD8;                 /* Signal Violet */
  }

  /* Right two-thirds: the ONE continuous copy story in ONE text frame.
     Name / Role / Product line / Email / Booking link run as a single
     flow (running lines, NOT five separate frames). */
  .story {
    position: absolute;
    left: 35mm;
    top: 6mm;
    width: 50mm;
    line-height: 1.26;
  }
  .story .name {
    font-weight: 700;
    font-size: 12.5pt;
    letter-spacing: 0.1pt;
  }
  .story .role {
    font-weight: 400;
    font-size: 8pt;
  }
  .story .product {
    font-weight: 400;
    font-size: 8pt;
  }
  .story .email {
    font-weight: 400;
    font-size: 7pt;
    letter-spacing: -0.1pt;
  }
  .story .link {
    font-weight: 400;
    font-size: 7pt;
    letter-spacing: -0.1pt;
  }

  /* Bottom-right: static drawn code square placeholder (an ORDINARY graphic
     frame). Drawn inline as SVG — NOT a placed image — so it converts to a
     normal graphic frame that will accept a per-record code mapping yet can
     never render a variable code. A dead placeholder. */
  .code {
    position: absolute;
    right: 4mm;
    top: 34mm;
    width: 12.5mm;
    height: 12.5mm;
  }
  .code svg { display: block; width: 100%; height: 100%; }
  .caption {
    position: absolute;
    right: 4mm;
    top: 47mm;
    width: 12.5mm;
    text-align: center;
    font-size: 5.4pt;
    font-weight: 400;
    color: #1C2230;
    letter-spacing: 0.2pt;
  }
</style>
</head>
<body>
