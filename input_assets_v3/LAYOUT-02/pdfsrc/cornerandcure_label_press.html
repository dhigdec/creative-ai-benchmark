<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corner &amp; Cure — cold case shelf label</title>
<style>
  /* Trim = media box. 90 x 55 mm landscape, NO bleed box (0 mm bleed). */
  @page { size: 90mm 55mm; margin: 0; }
  html, body { margin: 0; padding: 0; }

  .card {
    position: relative;
    width: 90mm;
    height: 55mm;
    box-sizing: border-box;
    overflow: hidden;
    background: #F2E7CE;                 /* Butcher Cream ground */
    color: #2A2622;                      /* Slate Char ink */
    font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
  }

  /* thin printer keyline just inside the trim (no bleed) */
  .keyline {
    position: absolute;
    left: 2.2mm; top: 2.2mm; right: 2.2mm; bottom: 2.2mm;
    border: 0.3mm solid #2A2622;
    pointer-events: none;
  }

  /* --- MANDATORY placed graphic frame: real product photograph --- */
  .photo {
    position: absolute;
    left: 4.5mm; top: 4.5mm;
    width: 29mm; height: 38.5mm;
    object-fit: cover;
    object-position: 50% 42%;
    border: 0.3mm solid #2A2622;
    display: block;
  }

  /* --- Decorative price ROUNDEL: a printed sunburst device, NOT a picture
         well. Inline SVG vector, price is reversed out of it (the price is
         part of the single name/size/price story, laid over this shape). --- */
  .roundel {
    position: absolute;
    right: 5.5mm; top: 9.5mm;
    width: 27mm; height: 27mm;
    z-index: 1;
  }

  /* --- ONE continuous text story: ITEM NAME + SIZE + PRICE set in a single
         text frame (not three addressable fields). Flows top-left toward the
         roundel; the price glyphs land reversed-out over the sunburst. --- */
  .story {
    position: absolute;
    left: 36mm; top: 4.5mm;
    width: 50mm; height: 38.5mm;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .story .ns { max-width: 27mm; }
  .story .name {
    font-family: 'Arial Narrow', 'Helvetica Neue Condensed', 'Roboto Condensed', 'Impact', sans-serif;
    font-weight: 700;
    font-stretch: condensed;
    font-size: 5.4mm;
    line-height: 0.97;
    letter-spacing: 0.02mm;
    text-transform: uppercase;
    color: #2A2622;                      /* Slate Char item name */
  }
  .story .size {
    font-family: 'Arial', 'Helvetica', sans-serif;
    font-weight: 400;
    font-size: 2.7mm;
    letter-spacing: 0.9mm;
    text-transform: uppercase;
    margin-top: 1.6mm;
    color: #4E4a44;
  }
  .story .price {
    width: 27mm;
    text-align: center;
    font-family: 'Arial Narrow', 'Helvetica Neue Condensed', 'Roboto Condensed', 'Impact', sans-serif;
    font-weight: 700;
    font-stretch: condensed;
    font-size: 8.2mm;
    line-height: 1;
    color: #F2E7CE;                      /* price reversed out of the red roundel */
    text-shadow: 0 0.15mm 0.3mm rgba(0,0,0,0.28);
  }

  /* --- Dietary tag strip: its own short, separate story --- */
  .tags {
    position: absolute;
    left: 4.5mm; right: 5.5mm; bottom: 4.5mm;
    height: 6.6mm;
    display: flex;
    align-items: center;
    gap: 1.6mm;
    font-family: 'Arial', 'Helvetica', sans-serif;
  }
  .tags .lead {
    font-size: 2.2mm;
    letter-spacing: 0.5mm;
    text-transform: uppercase;
    color: #4E4a44;
    margin-right: 0.4mm;
  }
  .pill {
    display: inline-block;
    padding: 0.9mm 2.2mm;
    background: #4E6B3A;                  /* Pickle Green pills */
    color: #F2E7CE;
    font-size: 2.3mm;
    font-weight: 700;
    letter-spacing: 0.4mm;
    text-transform: uppercase;
    border-radius: 1.6mm;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="keyline"></div>

    <!-- MANDATORY placed image: real graphic frame the conversion can bind to -->
    <img class="photo"
         src="file:///Users/dhiren/Downloads/Deccan/Adobe-Freelance-Leads/input_assets_v3/LAYOUT-02/assets/counter_shot_04.jpg"
         alt="The Corner Reuben on grilled dark rye">

    <!-- Decorative sunburst roundel (grouped vector path, not a picture well) -->
    <svg class="roundel" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="60.00,2.00 66.73,17.53 77.92,4.84 79.52,21.69 94.09,13.08 90.41,29.59 106.92,25.91 98.31,40.48 115.16,42.08 102.47,53.27 118.00,60.00 102.47,66.73 115.16,77.92 98.31,79.52 106.92,94.09 90.41,90.41 94.09,106.92 79.52,98.31 77.92,115.16 66.73,102.47 60.00,118.00 53.27,102.47 42.08,115.16 40.48,98.31 25.91,106.92 29.59,90.41 13.08,94.09 21.69,79.52 4.84,77.92 17.53,66.73 2.00,60.00 17.53,53.27 4.84,42.08 21.69,40.48 13.08,25.91 29.59,29.59 25.91,13.08 40.48,21.69 42.08,4.84 53.27,17.53"
               fill="#B4382C"/>
      <circle cx="60" cy="60" r="41" fill="#B4382C" stroke="#F2E7CE" stroke-width="1.4"/>
    </svg>

    <!-- ONE text frame: name + size + price as a single continuous story -->
    <div class="story">
      <div class="ns">
        <div class="name">The Corner Reuben</div>
        <div class="size">Half</div>
      </div>
      <div class="price">$12</div>
    </div>

    <!-- Separate short story: dietary tag strip -->
    <div class="tags">
      <span class="lead">Contains</span>
      <span class="pill">Gluten</span>
      <span class="pill">Dairy</span>
    </div>
  </div>
</body>
</html>
