<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apex Rally Club — Pin Backing Card 2025</title>
<style>
  /* Media box = trim, no bleed. Single card, portrait 70 x 100 mm. */
  @page { size: 70mm 100mm; margin: 0; }
  html, body { margin: 0; padding: 0; }

  /* Brand palette (Apex Rally Club) */
  :root {
    --rally-green: #2F5D3A;
    --ash-black:   #212322;
    --ochre:       #C98A2E;
    --struck-gold: #B7912F;
    --snow:        #F1EFE8;
  }

  .card {
    position: relative;
    width: 70mm;
    height: 100mm;
    box-sizing: border-box;
    overflow: hidden;
    background: var(--rally-green);
    color: var(--snow);
    padding: 5mm 5.5mm 8mm 5.5mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    font-family: Arial, Helvetica, sans-serif;
  }

  /* ---- Top third: crest roundel (inline SVG, NOT an image) + wordmark ---- */
  .crest { width: 20mm; height: 20mm; display: block; }

  .wordmark {
    margin-top: 1.4mm;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 12pt;
    letter-spacing: 1.4px;
    color: var(--snow);
    text-align: center;
    line-height: 1;
  }
  .rule {
    width: 34mm;
    height: 0.4mm;
    margin: 1.4mm 0 0 0;
    background: var(--ochre);
  }

  /* ---- Middle: die-cut PIN MOUNTING AREA — real placed graphic frame ---- */
  .mount {
    margin-top: 3mm;
    width: 50mm;
    height: 30mm;
    background: var(--snow);
    border: 0.5mm dashed var(--ochre);
    border-radius: 2mm;
    box-sizing: border-box;
    padding: 1.4mm;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .pin {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .mount-caption {
    margin-top: 1.2mm;
    font-size: 5pt;
    letter-spacing: 1.2px;
    color: var(--ochre);
    text-transform: uppercase;
  }

  /* ---- Lower third: variable text block as ONE continuous text story ---- */
  .variable-story {
    margin-top: 2.6mm;
    text-align: center;
    color: var(--snow);
    font-size: 8.5pt;
    line-height: 1.45;
  }
  .variable-story .lbl {
    font-weight: 700;
    letter-spacing: 1.4px;
    color: var(--ochre);
  }
  .variable-story .blurb {
    display: inline-block;
    margin-top: 1.2mm;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 7.5pt;
    letter-spacing: 0.4px;
    color: var(--snow);
  }

  /* Address / note strip pinned to the trim edge (carries the stale year) */
  .footer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 1.6mm 4mm 2mm 4mm;
    text-align: center;
    font-size: 5pt;
    letter-spacing: 0.6px;
    color: var(--snow);
    opacity: 0.9;
    border-top: 0.25mm solid rgba(241,239,232,0.35);
  }
</style>
</head>
<body>
  <div class="card">

    <!-- Crest roundel: inline SVG vector emblem, must trace as vector (no graphic frame) -->
    <svg class="crest" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Apex Rally Club crest">
      <defs>
        <path id="ringTop" d="M 30 100 A 70 70 0 0 1 170 100" fill="none"/>
        <path id="ringBot" d="M 38 100 A 62 62 0 0 0 162 100" fill="none"/>
      </defs>
      <!-- ring -->
      <circle cx="100" cy="100" r="80" fill="none" stroke="#F1EFE8" stroke-width="2"/>
      <circle cx="100" cy="100" r="73" fill="none" stroke="#C98A2E" stroke-width="1"/>
      <text font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700"
            letter-spacing="1.2" fill="#F1EFE8">
        <textPath href="#ringTop" startOffset="50%" text-anchor="middle">APEX RALLY CLUB</textPath>
      </text>
      <text font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700"
            letter-spacing="2" fill="#C98A2E">
        <textPath href="#ringBot" startOffset="50%" text-anchor="middle">EST. 1987</textPath>
      </text>
      <!-- shield -->
      <path d="M100 52 L140 66 L140 108 C140 138 118 152 100 158 C82 152 60 138 60 108 L60 66 Z"
            fill="#2F5D3A" stroke="#F1EFE8" stroke-width="2.4"/>
      <!-- mountain hairpin road -->
      <path d="M78 140 C78 116 122 124 122 102 C122 82 82 92 84 72"
            fill="none" stroke="#F1EFE8" stroke-width="4.5" stroke-linecap="round"/>
      <!-- summit apex -->
      <path d="M74 78 L84 60 L94 78 Z" fill="#C98A2E"/>
      <!-- chequer motif -->
      <g fill="#C98A2E">
        <rect x="88" y="120" width="7" height="7"/>
        <rect x="102" y="120" width="7" height="7"/>
        <rect x="95" y="127" width="7" height="7"/>
        <rect x="81" y="127" width="7" height="7"/>
        <rect x="109" y="127" width="7" height="7"/>
      </g>
    </svg>

    <div class="wordmark">APEX RALLY CLUB</div>
    <div class="rule"></div>

    <!-- PIN MOUNTING AREA: genuine placed-image graphic frame (per-record art binds here) -->
    <div class="mount">
      <img class="pin"
           src="file:///Users/dhiren/Downloads/Deccan/Adobe-Freelance-Leads/input_assets_v3/VECTOR-03/assets/apex_reference_sheet_gravelloop.jpg"
           alt="Gravel Loop pin artwork">
    </div>
    <div class="mount-caption">Hard Enamel Pin · 32 mm</div>

    <!-- Variable block: ONE continuous text story (single flow, not four frames) -->
    <div class="variable-story">
      <span class="lbl">DESIGN</span>&nbsp;&nbsp;Gravel Loop<br>
      <span class="lbl">SKU</span>&nbsp;&nbsp;APX-GL<br>
      <span class="lbl">EDITION</span>&nbsp;&nbsp;300<br>
      <span class="lbl">PRICE</span>&nbsp;&nbsp;$12<br>
      <span class="blurb">Chasing the line since 1987</span>
    </div>

    <!-- Address / note strip. NOTE: baked year is last season's — template not rolled for the new run. -->
    <div class="footer">Apex Rally Club · Waterbury, Vermont · apexrallyclub.org<br>© 2025 Apex Rally Club — merch table proof, no reprint without approval</div>

  </div>
</body>
</html>
