<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kilnmore Shelf Card</title>
<style>
  /* Flat press card — A6 portrait, trim = media box, NO bleed. */
  @page { size: 105mm 148mm; margin: 0; }
  html, body { margin: 0; padding: 0; }

  .card {
    position: relative;
    width: 105mm;
    height: 148mm;
    overflow: hidden;
    background: #FCFBF8;            /* paper white stock */
    box-sizing: border-box;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* 1) GLAZE COLOUR BAND — solid swatch of the piece's glaze hex, ~28 mm at the head */
  .band {
    position: absolute;
    top: 0; left: 0;
    width: 105mm;
    height: 28mm;
    background: #9FB3A2;           /* {{glaze_colour}} — Celadon Drift */
  }
  .band .swatch-id {
    position: absolute;
    left: 12mm;
    bottom: 3.5mm;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 6.5pt;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #2C2620;
  }

  /* 2) SQUARE GLAZE PICTURE BLOCK — the ONE graphic frame, 70 x 70 mm, centred */
  .pic {
    position: absolute;
    top: 38mm;
    left: 17.5mm;                  /* (105 - 70) / 2, centred */
    width: 70mm;
    height: 70mm;
    overflow: hidden;
    background: #EFE9DD;           /* bone fallback behind the placed graphic */
    border: 0.25mm solid #D8D2C6; /* hairline keyline, printer's proof */
    box-sizing: border-box;
  }
  .pic img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* 3) COPY BLOCK — FOUR lines set as ONE continuous text story (soft breaks,
        care_line the trailing run). Serif display over grotesque text. */
  .copy {
    position: absolute;
    top: 113mm;
    left: 12mm;
    width: 81mm;
    text-align: left;
    line-height: 1.5;
    color: #2C2620;
  }
  .copy .name {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 15pt;
  }
  .copy .glazeform {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 9.5pt;
    color: #3B342B;
  }
  .copy .specs {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 8pt;
    color: #5A5248;
  }
  .copy .care {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 7pt;
    color: #6B6358;
    line-height: 1.3;
  }

  /* Printer's card foot — brand set in type + consignment price (separate frame) */
  .foot {
    position: absolute;
    left: 12mm;
    right: 12mm;
    bottom: 5mm;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: Arial, Helvetica, sans-serif;
    color: #3B342B;
  }
  .foot .wm {
    font-size: 8pt;
    letter-spacing: 0.30em;
    text-transform: uppercase;
  }
  .foot .price {
    font-size: 8pt;
  }
</style>
</head>
<body>
  <div class="card">

    <!-- 1) Glaze colour band -->
    <div class="band">
      <div class="swatch-id">Celadon Drift &middot; #9FB3A2</div>
    </div>

    <!-- 2) Square glaze picture block: the ONE graphic frame -->
    <div class="pic">
      <img src="file:///Users/dhiren/Downloads/Deccan/Adobe-Freelance-Leads/input_assets_v3/PHOTO-12/assets/kilnmore_glaze_macros_01.jpg" alt="Celadon Drift glaze surface">
    </div>

    <!-- 3) Copy block: ONE continuous story, four soft-broken runs, care_line trailing -->
    <div class="copy"><span class="name">Tide Mug</span><br><span class="glazeform">Celadon Drift &mdash; mug</span><br><span class="specs">H 95 mm &middot; &Oslash; 82 mm &middot; 330 ml &middot; Oxidation, cone 6</span><br><span class="care">Wheel-thrown stoneware. Food, microwave and dishwasher safe. Not for stovetop or open flame.</span></div>

    <!-- Printer's card foot -->
    <div class="foot">
      <span class="wm">Kilnmore</span>
      <span class="price">Consignment $42</span>
    </div>

  </div>
</body>
</html>
