<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Northwind Advisory Partners &mdash; adviser introduction card (2025 press reissue)</title>
<style>
  /* Trim = media box. 85 x 55 mm landscape. No bleed box (0 mm bleed).
     Prints byte-for-byte identically to the 2024 file; differs only underneath:
     the whole card is flattened, the copy collapsed into ONE continuous story. */
  @page { size: 85mm 55mm; margin: 0; }
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .card {
    position: relative;
    width: 85mm;
    height: 55mm;
    overflow: hidden;
    background: #F5F3EE;            /* Paper White ground */
    color: #1E2A3A;                 /* Federal Navy default ink */
    font-family: Georgia, 'Times New Roman', serif;
  }

  /* Left third: portrait, head and shoulders, flush to the left and top edges.
     In this reissue the picture was rasterised and baked into the page artwork. */
  .portrait {
    position: absolute;
    top: 0;
    left: 0;
    width: 28.3mm;
    height: 55mm;
    object-fit: cover;
    object-position: 50% 22%;
    display: block;
  }

  /* ONE continuous text story in a single text frame: name, credentials,
     practice, dial and email all flow as one block, no separate fields. */
  .story {
    position: absolute;
    left: 33mm; top: 8mm; width: 48mm;
    font-family: Georgia, 'Times New Roman', serif;
    color: #1E2A3A;
  }
  .story .l-name {
    display: block;
    font-weight: 600;
    font-size: 13pt;
    line-height: 1.05;
    letter-spacing: 0.01em;
    color: #1E2A3A;                 /* Federal Navy */
  }
  .story .l-hair {
    display: block;
    width: 18mm; height: 0.25mm;
    background: #9C8452;            /* Compass Brass hairline */
    margin: 1.6mm 0 1.5mm 0;
  }
  .story .l-cred {
    display: block;
    font-variant: small-caps;
    font-size: 8pt;
    letter-spacing: 0.11em;
    color: #9C8452;                 /* Compass Brass */
  }
  .story .l-practice {
    display: block;
    font-style: italic;
    font-size: 8pt;
    margin-top: 1.4mm;
    color: #5B646E;                 /* Slate Grey */
  }
  .story .l-dial {
    display: block;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 7.2pt;
    letter-spacing: 0.02em;
    margin-top: 11mm;
    color: #1E2A3A;                 /* Federal Navy */
  }
  .story .l-email {
    display: block;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 7.2pt;
    letter-spacing: 0.01em;
    margin-top: 1.6mm;
    color: #1E2A3A;                 /* Federal Navy */
  }

  /* Small compass-rose mark, bottom-right, Compass Brass. Vector path group. */
  .mark { position: absolute; right: 3.6mm; bottom: 3.4mm; width: 8.6mm; height: 8.6mm; }
</style>
</head>
<body>
  <div class="card">
    <!-- Portrait baked into the flattened page (no bindable graphic frame) -->
    <img class="portrait"
         src="file:///Users/dhiren/Downloads/Deccan/Adobe-Freelance-Leads/input_assets_v3/LAYOUT-19/assets/northwind_sitting_01.jpg"
         alt="Eleanor Whitcombe">

    <!-- ONE continuous story: every line lives in a single text frame -->
    <div class="story">
      <span class="l-name">Eleanor Whitcombe</span>
      <span class="l-hair"></span>
      <span class="l-cred">CFA, CAIA</span>
      <span class="l-practice">Endowments &amp; Foundations</span>
      <span class="l-dial">+1&nbsp;617&nbsp;555&nbsp;0142</span>
      <span class="l-email">eleanor.whitcombe@northwindadvisory.com</span>
    </div>

    <!-- Decorative compass-rose mark (vector path group) -->
    <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon fill="#9C8452"
        points="50,5 54.59,38.91 81.82,18.18 61.09,45.41 95,50 61.09,54.59 81.82,81.82 54.59,61.09 50,95 45.41,61.09 18.18,81.82 38.91,54.59 5,50 38.91,45.41 18.18,18.18 45.41,38.91"/>
      <circle cx="50" cy="50" r="9" fill="#F5F3EE"/>
      <circle cx="50" cy="50" r="9" fill="none" stroke="#9C8452" stroke-width="2.4"/>
    </svg>
  </div>
</body>
</html>
