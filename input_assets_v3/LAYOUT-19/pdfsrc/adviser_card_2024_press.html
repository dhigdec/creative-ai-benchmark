<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Northwind Advisory Partners &mdash; adviser introduction card (2024 press)</title>
<style>
  /* Trim = media box. 85 x 55 mm landscape. No bleed box (0 mm bleed). */
  @page { size: 85mm 55mm; margin: 0; }
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .card {
    position: relative;
    width: 85mm;
    height: 55mm;
    overflow: hidden;
    background: #F5F3EE;            /* Paper White ground */
    color: #1E2A3A;                 /* Federal Navy default ink */
    font-family: Georgia, 'Times New Roman', serif;
  }

  /* Left third: PORTRAIT placed as a linked graphic (its own graphic frame),
     head and shoulders, flush to the left and top card edges. */
  .portrait {
    position: absolute;
    top: 0;
    left: 0;
    width: 28.3mm;
    height: 55mm;
    object-fit: cover;
    object-position: 50% 22%;
    display: block;
  }

  /* Each copy field sits in its own separately addressable text frame. */
  .frame { position: absolute; }

  .f-name {
    left: 33mm; top: 8mm; width: 48mm;
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 600;
    font-size: 13pt;
    line-height: 1.05;
    letter-spacing: 0.01em;
    color: #1E2A3A;                 /* Federal Navy */
  }
  .rule {
    position: absolute;
    left: 33mm; top: 15.4mm; width: 18mm; height: 0.25mm;
    background: #9C8452;            /* Compass Brass hairline */
  }
  .f-cred {
    left: 33mm; top: 17.4mm; width: 48mm;
    font-family: Georgia, 'Times New Roman', serif;
    font-variant: small-caps;
    font-size: 8pt;
    letter-spacing: 0.11em;
    color: #9C8452;                 /* Compass Brass */
  }
  .f-practice {
    left: 33mm; top: 22.6mm; width: 48mm;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 8pt;
    color: #5B646E;                 /* Slate Grey */
  }
  .f-dial {
    left: 33mm; top: 38mm; width: 48mm;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 7.2pt;
    letter-spacing: 0.02em;
    color: #1E2A3A;                 /* Federal Navy */
  }
  .f-email {
    left: 33mm; top: 42.6mm; width: 48mm;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 7.2pt;
    letter-spacing: 0.01em;
    color: #1E2A3A;                 /* Federal Navy */
  }

  /* Small compass-rose mark, bottom-right, Compass Brass.
     Drawn as a vector path group (decorative), not a placed image. */
  .mark { position: absolute; right: 3.6mm; bottom: 3.4mm; width: 8.6mm; height: 8.6mm; }
</style>
</head>
<body>
  <div class="card">
    <!-- GRAPHIC FRAME (linked): per-adviser portrait, left third -->
    <img class="portrait"
         src="file:///Users/dhiren/Downloads/Deccan/Adobe-Freelance-Leads/input_assets_v3/LAYOUT-19/assets/northwind_sitting_01.jpg"
         alt="Eleanor Whitcombe">

    <!-- Five separate, addressable text frames -->
    <div class="frame f-name">Eleanor Whitcombe</div>
    <div class="rule"></div>
    <div class="frame f-cred">CFA, CAIA</div>
    <div class="frame f-practice">Endowments &amp; Foundations</div>
    <div class="frame f-dial">+1&nbsp;617&nbsp;555&nbsp;0142</div>
    <div class="frame f-email">eleanor.whitcombe@northwindadvisory.com</div>

    <!-- Decorative compass-rose mark (vector path group) -->
    <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon fill="#9C8452"
        points="50,5 54.59,38.91 81.82,18.18 61.09,45.41 95,50 61.09,54.59 81.82,81.82 54.59,61.09 50,95 45.41,61.09 18.18,81.82 38.91,54.59 5,50 38.91,45.41 18.18,18.18 45.41,38.91"/>
      <!-- open centre ring: paper punched through, thin brass outline -->
      <circle cx="50" cy="50" r="9" fill="#F5F3EE"/>
      <circle cx="50" cy="50" r="9" fill="none" stroke="#9C8452" stroke-width="2.4"/>
    </svg>
  </div>
</body>
</html>
