<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>In Memory of Walter Fernwood — Keepsake Card</title>
<style>
  /* A6 keepsake card, 105 x 148 mm PORTRAIT. Media box = trim, NO bleed box. */
  @page { size: 105mm 148mm; margin: 0; }
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .card {
    position: relative;
    width: 105mm;
    height: 148mm;
    background: #EFE9DC;            /* Archive Cream ground */
    color: #3A322A;                 /* Ink Brown */
    font-family: Georgia, 'Times New Roman', serif;  /* quiet classical serif */
    overflow: hidden;
    padding: 11mm 12mm 9mm 12mm;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Placed photograph in a real rectangular graphic frame, portrait-ish, ~48 x 62 mm,
     0.5pt Mount Grey keyline. This is a MANDATORY placed image. */
  .plate {
    width: 48mm;
    height: 62mm;
    border: 0.5pt solid #9A948A;    /* Mount Grey keyline */
    background: #d9d3c7;
    overflow: hidden;
    margin-top: 2mm;
    margin-bottom: 8mm;
    flex: 0 0 auto;
  }
  .plate img {
    width: 100%;
    height: 100%;
    object-fit: cover;              /* plate cut to the portrait frame */
    object-position: 50% 42%;
    display: block;
  }

  .name {
    font-size: 20pt;
    line-height: 1.15;
    font-weight: 400;
    letter-spacing: 0.2pt;
    text-align: center;
    color: #3A322A;                 /* Ink Brown */
    margin: 0 0 5mm 0;
    flex: 0 0 auto;
  }

  /* RELATIONSHIP line in a FIXED-MEASURE, fixed-height text frame:
     ~62 mm wide x exactly TWO lines tall at 11pt, auto-size OFF, overflow clipped.
     A long sentence oversets and simply STOPS RENDERING at the frame's last visible
     line — no spill, no error — so it is cut mid-phrase at trim. */
  .relationship {
    width: 62mm;
    height: 10.6mm;                 /* two lines at 11pt / 1.35 leading */
    font-size: 11pt;
    line-height: 1.35;
    text-align: center;
    color: #4C4A46;                 /* Slate Charcoal */
    overflow: hidden;               /* fixed frame: overset does not render */
    flex: 0 0 auto;
  }

  .spacer { flex: 1 1 auto; }

  .dates {
    font-size: 9pt;
    line-height: 1.3;
    font-variant: small-caps;
    letter-spacing: 0.6pt;
    text-align: center;
    color: #3A322A;                 /* Ink Brown */
    flex: 0 0 auto;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="plate">
      <img src="file:///Users/dhiren/Downloads/Deccan/Adobe-Freelance-Leads/input_assets_v3/LAYOUT-20/assets/phone_2022_walter_chair.jpg" alt="Walter Fernwood">
    </div>

    <div class="name">Arthur Bell</div>

    <div class="relationship">Walter taught him to fish on the Connecticut River every summer for nearly forty years</div>

    <div class="spacer"></div>

    <div class="dates">In memory of Walter Fernwood &middot; 1930&ndash;2024</div>
  </div>
</body>
</html>
