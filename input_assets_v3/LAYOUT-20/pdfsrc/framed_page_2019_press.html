<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>In Memory of Walter Fernwood — Framed Memorial Page</title>
<style>
  /* A4 framed memorial page, 210 x 297 mm PORTRAIT. Media box = trim, NO bleed box.
     No bleed can be introduced; the plate lives inside the keyline with white margin. */
  @page { size: 210mm 297mm; margin: 0; }
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .page {
    position: relative;
    width: 210mm;
    height: 297mm;
    background: #EFE9DC;            /* Archive Cream ground */
    color: #3A322A;                 /* Ink Brown */
    font-family: Georgia, 'Times New Roman', serif;  /* quiet classical serif */
    overflow: hidden;
    padding: 22mm 30mm 20mm 30mm;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Large PLATE AREA, top two-thirds. Fixed PORTRAIT graphic frame ~150 x 190 mm,
     0.75pt Mount Grey keyline. A landscape subject placed into this portrait frame is
     filled-and-centred, so the subject's left and right are clipped by the frame's own
     fitting — the plate arrives cropped even though the scan itself is whole. */
  .plate {
    width: 150mm;
    height: 190mm;
    border: 0.75pt solid #9A948A;   /* Mount Grey keyline */
    background: #d9d3c7;
    overflow: hidden;
    margin-bottom: 12mm;
    flex: 0 0 auto;
  }
  .plate img {
    width: 100%;
    height: 100%;
    object-fit: cover;              /* landscape subject clipped by portrait frame */
    object-position: 50% 45%;
    display: block;
  }

  .name {
    font-size: 30pt;
    line-height: 1.1;
    font-weight: 400;
    letter-spacing: 0.3pt;
    text-align: center;
    color: #3A322A;                 /* Ink Brown */
    margin: 0 0 4mm 0;
    flex: 0 0 auto;
  }

  .dates {
    font-size: 12pt;
    line-height: 1.3;
    font-variant: small-caps;
    letter-spacing: 0.8pt;
    text-align: center;
    color: #3A322A;                 /* Ink Brown */
    margin: 0 0 9mm 0;
    flex: 0 0 auto;
  }

  .spacer { flex: 1 1 auto; }

  .verse {
    font-size: 12pt;
    line-height: 1.5;
    font-style: italic;
    text-align: center;
    color: #4C4A46;                 /* Slate Charcoal */
    flex: 0 0 auto;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="plate">
      <img src="file:///Users/dhiren/Downloads/Deccan/Adobe-Freelance-Leads/input_assets_v3/LAYOUT-20/assets/phone_2019_walter_porch.jpg" alt="Walter Fernwood">
    </div>

    <div class="name">Walter Fernwood</div>
    <div class="dates">1930 &ndash; 2024</div>

    <div class="spacer"></div>

    <div class="verse">
      He mended things and kept his tools clean.<br>
      He sat with her every afternoon and told no one.<br>
      We are keeping him as he was,<br>
      which was enough.
    </div>
  </div>
</body>
</html>
