<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Isla Verde — 2016 door plate (facility) press artwork</title>
<style>
  /* Media box = trim. 150 x 60 mm landscape. NO bleed (none present, none can be added:
     the existing fixings are drilled for this exact size). */
  @page { size: 150mm 60mm; margin: 0; }
  html, body { margin: 0; padding: 0; }

  /* Deep Palm plate, Sand Cream reversed text — the 2016 sign-shop artwork the current
     facility plates were cut from. One facility per page. */
  .plate {
    position: relative;
    box-sizing: border-box;
    width: 150mm;
    height: 60mm;
    background: #2C3B34;               /* Deep Palm */
    color: #EFE9DD;                    /* Sand Cream (reversed) */
    overflow: hidden;                  /* the plate is the media box; nothing runs past trim */
    font-family: Georgia, 'Times New Roman', Times, serif;
  }

  /* Isla Verde monogram at the LEFT — real vector geometry (inline SVG, NOT a placed image):
     interlocking I and V inside a fine OVAL RULE with a small palm frond at the join.
     Fine stroke weight / rounded terminals = the 2016 programme. */
  .monogram {
    position: absolute;
    left: 11mm;
    top: 14mm;                         /* (60 - 32) / 2 = 14mm : vertically centred */
    width: 32mm;
    height: 32mm;
  }
  .monogram svg { display: block; width: 100%; height: 100%; }

  /* THE STORY.
     One continuous text story / one flow, in field order: NUMBER, NAME (EN), NAME (ES).
     All three fields live inside this single frame — the way the 2016 file was set. */
  .story {
    position: absolute;
    left: 50mm;
    top: 6mm;                          /* 6mm clear space (door-plate minimum) */
    right: 6mm;                        /* right edge lands at 144mm = 150 - 6mm clear */
    bottom: 6mm;
  }

  /* Small room NUMBER, top-right of the story frame. First field in the story order. */
  .num {
    position: absolute;
    top: 0;
    right: 0;
    font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
    font-size: 6mm;
    line-height: 1;
    letter-spacing: 0.06em;
    color: #D8CFC0;                    /* Warm Stone — quiet */
    font-weight: 400;
  }

  /* The bilingual name block, vertically centred in the frame. */
  .names {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    /* FIXED-MEASURE frame: sized to the longest facility name the property had in 2016.
       A longer string does NOT wrap, reflow or overset — it simply stops rendering at the
       right edge. The EN and ES lines share this same measure and fail at different lengths. */
    width: 94mm;
  }

  .name-en {
    font-size: 11.5mm;                 /* cap height ~8mm : at or above the 8mm door-plate minimum */
    line-height: 1.02;
    letter-spacing: 0.005em;
    color: #EFE9DD;                    /* Sand Cream */
    white-space: nowrap;               /* fixed-measure: no wrap */
    overflow: hidden;                  /* fixed-measure: truncates instead of overrunning */
  }

  .name-es {
    margin-top: 1.5mm;
    font-size: 8mm;                    /* quieter second (Spanish) language */
    line-height: 1.02;
    letter-spacing: 0.01em;
    color: #D8CFC0;                    /* Warm Stone — the reversed secondary line */
    white-space: nowrap;               /* same fixed-measure story behaviour */
    overflow: hidden;
  }
</style>
</head>
<body>
  <!-- One facility per page. Baked representative record = the 2016 plate example:
       NUMBER 12  |  NAME (EN) Spa Reception  |  NAME (ES) Recepción del Spa.
       (The "12" is the stale 2016 plate number; the live schedule now lists Spa Reception
       as facility 5 — a stale baked value the merge is meant to overwrite.) -->
  <div class="plate">

    <!-- Monogram: inline SVG vector, transparent ground so the Deep Palm shows through. -->
    <div class="monogram">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Isla Verde monogram">
        <!-- fine oval rule -->
        <ellipse cx="50" cy="50" rx="31" ry="40" fill="none" stroke="#EFE9DD" stroke-width="2"/>
        <!-- interlocking serif I and V -->
        <text x="40" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="40"
              fill="#EFE9DD" text-anchor="middle">I</text>
        <text x="58" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="46"
              fill="#EFE9DD" text-anchor="middle">V</text>
        <!-- small palm frond at the join: central spine + fine leaflets -->
        <g stroke="#EFE9DD" stroke-width="1.1" fill="none" stroke-linecap="round">
          <line x1="50" y1="62" x2="50" y2="33"/>
          <path d="M50 37 L44 33 M50 37 L56 33"/>
          <path d="M50 42 L43 39 M50 42 L57 39"/>
          <path d="M50 47 L43 45 M50 47 L57 45"/>
          <path d="M50 52 L44 51 M50 52 L56 51"/>
          <path d="M50 57 L45 57 M50 57 L55 57"/>
        </g>
      </svg>
    </div>

    <!-- Single continuous text story: NUMBER, NAME (EN), NAME (ES). -->
    <div class="story">
      <div class="num">12</div>
      <div class="names">
        <div class="name-en">Spa Reception</div>
        <div class="name-es">Recepci&oacute;n del Spa</div>
      </div>
    </div>

  </div>
</body>
</html>
