<!--
  Ironway Run Club — Founders Five race bib (last season's press PDF, flat single record).
  Trim 152 x 203 mm PORTRAIT (6 x 8 in). Media box = trim, NO bleed box.
  ONE ink: Rail Navy #1F2A44 on Bib White #F4F2EC ground. Fonts embedded on Chrome print.

  Structural traps baked in, faithful to the layout spec:
   1. HEAD mark is a PLACED RASTER IMAGE (last season's low-res scan of the singlet mark) in
      one rectangular graphic frame -> a real graphic frame convert_pdf_to_indd must expose,
      and stale placed artwork the recovered mark plate has to REPLACE, not sit beside.
   2. NAME + PACE GROUP + EMERGENCY CONTACT are ONE continuous threaded story in a SINGLE text
      frame (.story), separated only by line breaks -> not three addressable frames.
   3. The NAME sits at the head of that story in a FIXED MEASURE (fixed width, nowrap,
      overflow:hidden) -> long names stop silently, no wrap, no overset.
   4. Media box = trim, 0 mm bleed -> a press-ready-with-bleed delivery cannot be honoured.
  Representative single record: Del Marchetti (bib 1) from ironway_roster.csv.
-->
<style>
  @page { size: 152mm 203mm; margin: 0; }
  html, body { margin: 0; padding: 0; }

  .bib {
    position: relative;
    box-sizing: border-box;
    width: 152mm;
    height: 203mm;
    background: #F4F2EC;              /* Bib White ground */
    color: #1F2A44;                  /* Rail Navy — the one ink */
    overflow: hidden;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* HEAD — placed raster scan of the club mark, one graphic frame */
  .mark {
    position: absolute;
    top: 11mm;
    left: 50%;
    transform: translateX(-50%);
    width: 56mm;
    height: 34mm;                    /* ~34 mm tall, centred at the top */
    overflow: hidden;
  }
  .mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 44%;
    transform: scale(1.78);          /* zoom the placed scan onto the printed mark */
    transform-origin: 50% 44%;
    filter: grayscale(1) contrast(1.05);
  }

  /* BIG NUMBER — its own single text frame */
  .number {
    position: absolute;
    left: 0;
    right: 0;
    top: 56mm;
    height: 92mm;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .number span {
    font-family: Arial, 'Helvetica Neue', sans-serif;
    font-weight: 900;
    font-size: 126mm;                /* ~90 mm cap height, read across a wet road */
    line-height: 0.72;
    letter-spacing: -2mm;
    color: #1F2A44;
  }

  /* THE STORY — ONE text frame: name -> pace group -> emergency contact,
     separated only by line breaks. Fixed measure on the name. */
  .story {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 165mm;
    width: 108mm;                    /* fixed measure, sized to last season's longest name */
    overflow: hidden;               /* silent truncation — no wrap, no overset */
    text-align: center;
    color: #1F2A44;
  }
  .story .nm {
    display: inline-block;
    max-width: 108mm;
    white-space: nowrap;             /* long names stop; they do not wrap */
    overflow: hidden;
    font-family: 'Arial Narrow', 'Helvetica Neue Condensed', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700;
    font-stretch: condensed;
    font-size: 11mm;
    line-height: 1.05;
  }
  .story .pace {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 600;
    font-size: 6mm;
    line-height: 1.5;
  }
  .story .emc {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 400;
    font-size: 5.2mm;
    line-height: 1.4;
    white-space: nowrap;
  }
</style>

<div class="bib">

  <!-- HEAD: placed raster scan of last season's club mark (graphic frame) -->
  <div class="mark">
    <img src="file:///Users/dhiren/Downloads/Deccan/Adobe-Freelance-Leads/input_assets_v3/VECTOR-14/assets/ironway_singlet_mark.jpg" alt="Ironway Run Club mark (placed scan)">
  </div>

  <!-- BIG NUMBER: single text frame -->
  <div class="number"><span>1</span></div>

  <!-- STORY: one continuous text frame, line breaks only -->
  <div class="story"><span class="nm">Del Marchetti</span><br>
<span class="pace">Sub 7</span><br>
<span class="emc">Rosa Marchetti&nbsp;&nbsp;&middot;&nbsp;&nbsp;(401) 555-0142</span></div>

</div>
