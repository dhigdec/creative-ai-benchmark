<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cedarline Institute - Certificate of Completion</title>
<style>
  /* Media box = trim (A4 landscape), no bleed */
  @page { size: 297mm 210mm; margin: 0; }
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }

  .card {
    position: relative;
    width: 297mm; height: 210mm;
    background: #F3EBD8;                 /* Warm Certificate Cream */
    overflow: hidden;
    /* warm, plainly legible serif for the community register */
    font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif;
    color: #1E2620;                      /* Deep Ink */
  }

  .institute {
    position: absolute; top: 15mm; left: 0; width: 297mm;
    text-align: center;
    font-variant: small-caps;
    letter-spacing: 0.18em;
    font-size: 15.5pt; font-weight: 700;
    color: #33503C;                      /* Cedar Green */
  }
  .rule {
    position: absolute; top: 26mm; left: 108.5mm; width: 80mm; height: 0;
    border-top: 0.7pt solid #9A7B33;     /* Engraved Gold rule */
  }
  .heading {
    position: absolute; top: 38mm; left: 0; width: 297mm;
    text-align: center;
    font-size: 31pt; font-weight: 400; letter-spacing: 0.01em;
    color: #1E2620;
  }

  /* THE TRAP: recipient name, programme title, completion date, the
     letterspaced credential number and the honours line are ONE continuous
     text story in a SINGLE frame flowing down the centre - not five frames.
     Each is its own paragraph/run inside this one story. */
  .story {
    position: absolute; top: 64mm; left: 48.5mm; width: 200mm;
    text-align: center;
    color: #1E2620;
  }
  .story .static   { font-size: 13pt; }
  .story .name     { font-size: 35pt; margin: 6mm 0 5mm; letter-spacing: 0.01em; }
  .story .programme{ font-size: 19pt; margin: 0 0 6mm; }
  .story .date     { font-size: 12.5pt; margin: 0 0 6mm; }
  .story .credential { font-size: 11pt; color: #5A6066; margin: 0 0 3.5mm; }  /* Slate Grey */
  .story .credential .ls { letter-spacing: 0.36em; }  /* the wide-tracked styled run */
  .story .honours  { font-size: 11.5pt; font-style: italic; }

  /* A REAL rectangular graphic frame at the seal position: the blind-emboss
     seal placed as an image so a per-record seal has a target to bind into. */
  .seal {
    position: absolute; top: 150mm; left: 53mm; width: 42mm; height: 42mm;
  }
  .seal img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }

  /* The two signatory lines sit alone in their own SEPARATE frame at the foot. */
  .signatures {
    position: absolute; bottom: 17mm; left: 40mm; width: 217mm;
    display: flex; justify-content: space-between;
  }
  .sig { width: 92mm; text-align: center; }
  .sig .line { border-top: 0.5pt solid #1E2620; margin-bottom: 2mm; }
  .sig .who  { font-size: 10.5pt; color: #1E2620; }
</style>
</head>
<body>
  <div class="card">
    <div class="institute">Cedarline Institute</div>
    <div class="rule"></div>
    <div class="heading">Certificate of Completion</div>

    <div class="story">
      <div class="static">This certifies that</div>
      <div class="name">Marcus Ellery</div>
      <div class="static">has completed the Certificate in</div>
      <div class="programme">Professional Practice</div>
      <div class="date">Completed on 17 October 2026</div>
      <div class="credential">No.&nbsp;<span class="ls">CL-2026-0101</span></div>
      <div class="honours">With Merit</div>
    </div>

    <div class="seal">
      <img src="file:///Users/dhiren/Downloads/Deccan/Adobe-Freelance-Leads/input_assets_v3/LAYOUT-22/assets/seal_impression.jpg" alt="Cedarline Institute blind-embossed seal, cedar device and founding year 1978">
    </div>

    <div class="signatures">
      <div class="sig"><div class="line"></div><div class="who">Helen Abbott &mdash; Registrar</div></div>
      <div class="sig"><div class="line"></div><div class="who">Callum Reyes &mdash; Community Programme Lead</div></div>
    </div>
  </div>
</body>
</html>
