<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verda founding member pass 2025</title>
<style>
  /* Media box = trim exactly. 89 x 51 mm landscape. No bleed box. */
  @page { size: 89mm 51mm; margin: 0; }
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }

  .card {
    position: relative;
    width: 89mm;
    height: 51mm;
    overflow: hidden;
    background: #F4F0E8;            /* Warm Off White ground */
    color: #33352E;                /* Soft Ink */
  }

  /* The ONE placed graphic frame: the instructor portrait, left third. */
  .portrait {
    position: absolute;
    top: 0;
    left: 0;
    width: 30mm;
    height: 51mm;
    object-fit: cover;
    object-position: 50% 32%;
    display: block;
  }

  /* Wordmark flattened into the card's background artwork -- top-right corner.
     Deliberately NOT a placed graphic (no <img>): it is baked into the card,
     so the converted document exposes NO second graphic frame for the mark. */
  .wordmark {
    position: absolute;
    top: 4.6mm;
    right: 6mm;
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-size: 15pt;
    letter-spacing: 0.4pt;
    color: #33352E;
    opacity: 0.92;
  }

  /* The four/five copy lines set as ONE continuous text story -- a single
     text block, not one frame per field. */
  .copy {
    position: absolute;
    top: 14mm;
    left: 34mm;
    right: 6mm;
    font-family: Helvetica, Arial, sans-serif;
    color: #33352E;
  }
  .copy .eyebrow {
    display: block;
    font-size: 6pt;
    letter-spacing: 1.8pt;
    text-transform: uppercase;
    color: #9CA98F;                /* Sage */
    margin-bottom: 1.6mm;
  }
  .copy .name {
    display: block;
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-size: 15pt;
    line-height: 1.1;
    margin-bottom: 1.4mm;
  }
  .copy .rule {
    display: block;
    width: 12mm;
    border: 0;
    border-top: 0.35mm solid #C7A97A;  /* Oak hairline */
    margin: 0 0 2.0mm 0;
  }
  .copy .line {
    display: block;
    font-size: 8pt;
    line-height: 1.75;
  }
  .copy .line .lab {
    color: #9CA98F;                /* Sage label */
    letter-spacing: 0.3pt;
  }
  .copy .contact {
    display: block;
    margin-top: 1.4mm;
    font-size: 7.5pt;
    color: #33352E;
  }
</style>
</head>
<body>
  <div class="card">
    <!-- MANDATORY placed graphic frame: real portrait photograph -->
    <img class="portrait"
         src="file:///Users/dhiren/Downloads/Deccan/Adobe-Freelance-Leads/input_assets_v3/PHOTO-28/assets/verda_instructor_01.jpg"
         alt="">

    <!-- Flattened wordmark (background artwork, not a placed graphic) -->
    <div class="wordmark">Verda</div>

    <!-- ONE continuous copy story (single text block) carrying last year's
         2025 sample values: instructor / class / price / validity / contact -->
    <div class="copy">
      <span class="eyebrow">Founding Member Pass</span>
      <span class="name">Erin Coyle</span>
      <hr class="rule">
      <span class="line"><span class="lab">Class</span>&nbsp;&nbsp;Foundation Reformer</span>
      <span class="line"><span class="lab">Price</span>&nbsp;&nbsp;$30 intro</span>
      <span class="line"><span class="lab">Valid</span>&nbsp;&nbsp;through Dec 2025</span>
      <span class="contact">hello@verdastudio.example</span>
    </div>
  </div>
</body>
</html>
