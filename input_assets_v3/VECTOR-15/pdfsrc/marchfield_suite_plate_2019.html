<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>marchfield_suite_plate_2019</title>
<style>
  /* Trim = media box = 200 x 75 mm landscape, NO bleed (media box equals trim). */
  @page { size: 200mm 75mm; margin: 0; }
  html, body { margin: 0; padding: 0; }

  :root {
    /* Single engraving ink: Slate Ink #2C3439 on a white proof ground. One ink only. */
    --ink: #2C3439;
    --ground: #FFFFFF;
  }

  * { box-sizing: border-box; }

  .card {
    width: 200mm;
    height: 75mm;
    background: var(--ground);
    color: var(--ink);
    /* Suite plate: 12 mm clear margin all round (fabricator survey). */
    padding: 12mm;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 14mm;
    overflow: hidden;
    /* Heritage serif companion for the plate: real embedded font stack, not a placeholder. */
    font-family: Georgia, "Times New Roman", Times, serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Crest lockup at left, ~32 mm across (survey). It is a GROUP OF VECTOR PATHS drawn
     inline as SVG in the single ink -- NOT a picture / graphic frame. There is no image
     well anywhere on the plate. */
  .crest {
    flex: 0 0 auto;
    width: 32mm;
    height: 32mm;
    display: block;
  }
  .crest svg { display: block; width: 100%; height: 100%; }
  .crest .stroke {
    fill: none;
    stroke: var(--ink);
    stroke-width: 2;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .crest .thin {
    fill: none;
    stroke: var(--ink);
    stroke-width: 1.4;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .crest .num {
    fill: none;
    stroke: var(--ink);
    stroke-width: 1.7;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  /* Right side: SUITE NUMBER (upper) and FIRM NAME (lower) look like two blocks but are
     ONE continuous text story in ONE frame -- suite number, a forced line break, then the
     firm name. Reachable only by position inside this single story, not frame by frame. */
  .story {
    flex: 0 1 auto;
    min-width: 0;
  }
  .suite {
    font-size: 30pt;
    font-weight: 700;
    letter-spacing: 0.6pt;
    line-height: 1.02;
  }
  .firm {
    font-size: 13.5pt;
    font-weight: 400;
    letter-spacing: 0.3pt;
    line-height: 1.15;
  }
</style>
</head>
<body>
  <!-- The Marchfield Exchange -- single suite plate, 2019 sign shop press artwork.
       Single record, one ink (Slate Ink #2C3439) on white proof ground, no bleed box.
       Baked sample record carries the ABANDONED 2019 numbering: SUITE 3C / Corliss & Vane
       Solicitors (the current schedule renumbered 3C -> 302, so this baked text must be
       replaced, not trusted, downstream). -->
  <div class="card">

    <!-- Crest: vector path group (2019 shop's own tracing), not an image well. -->
    <div class="crest">
      <svg viewBox="0 0 200 222" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Marchfield Exchange house crest">
        <!-- Oval laurel wreath: two stem arcs with outlined, veined leaves sweeping up each
             branch, open at the top and tied at the bottom. -->
        <!-- Stem arcs -->
        <path class="thin" d="M100,180 A70,78 0 0 1 100,22"/>
        <path class="thin" d="M100,180 A70,78 0 0 0 100,22"/>
        <!-- Right branch leaves -->
        <g class="thin">
          <g transform="rotate(15,100,100)"><path d="M100,24 C90,16 87,2 94,-6 C101,2 104,16 100,24 Z"/><path d="M100,21 L95,-3"/></g>
          <g transform="rotate(30,100,100)"><path d="M100,24 C90,16 87,2 94,-6 C101,2 104,16 100,24 Z"/><path d="M100,21 L95,-3"/></g>
          <g transform="rotate(45,100,100)"><path d="M100,24 C90,16 87,2 94,-6 C101,2 104,16 100,24 Z"/><path d="M100,21 L95,-3"/></g>
          <g transform="rotate(60,100,100)"><path d="M100,24 C90,16 87,2 94,-6 C101,2 104,16 100,24 Z"/><path d="M100,21 L95,-3"/></g>
          <g transform="rotate(75,100,100)"><path d="M100,24 C90,16 87,2 94,-6 C101,2 104,16 100,24 Z"/><path d="M100,21 L95,-3"/></g>
          <g transform="rotate(90,100,100)"><path d="M100,24 C90,16 87,2 94,-6 C101,2 104,16 100,24 Z"/><path d="M100,21 L95,-3"/></g>
          <g transform="rotate(105,100,100)"><path d="M100,24 C90,16 87,2 94,-6 C101,2 104,16 100,24 Z"/><path d="M100,21 L95,-3"/></g>
          <g transform="rotate(120,100,100)"><path d="M100,24 C90,16 87,2 94,-6 C101,2 104,16 100,24 Z"/><path d="M100,21 L95,-3"/></g>
          <g transform="rotate(135,100,100)"><path d="M100,24 C90,16 87,2 94,-6 C101,2 104,16 100,24 Z"/><path d="M100,21 L95,-3"/></g>
          <g transform="rotate(150,100,100)"><path d="M100,24 C90,16 87,2 94,-6 C101,2 104,16 100,24 Z"/><path d="M100,21 L95,-3"/></g>
        </g>
        <!-- Left branch leaves (mirrored) -->
        <g class="thin">
          <g transform="rotate(-15,100,100)"><path d="M100,24 C110,16 113,2 106,-6 C99,2 96,16 100,24 Z"/><path d="M100,21 L105,-3"/></g>
          <g transform="rotate(-30,100,100)"><path d="M100,24 C110,16 113,2 106,-6 C99,2 96,16 100,24 Z"/><path d="M100,21 L105,-3"/></g>
          <g transform="rotate(-45,100,100)"><path d="M100,24 C110,16 113,2 106,-6 C99,2 96,16 100,24 Z"/><path d="M100,21 L105,-3"/></g>
          <g transform="rotate(-60,100,100)"><path d="M100,24 C110,16 113,2 106,-6 C99,2 96,16 100,24 Z"/><path d="M100,21 L105,-3"/></g>
          <g transform="rotate(-75,100,100)"><path d="M100,24 C110,16 113,2 106,-6 C99,2 96,16 100,24 Z"/><path d="M100,21 L105,-3"/></g>
          <g transform="rotate(-90,100,100)"><path d="M100,24 C110,16 113,2 106,-6 C99,2 96,16 100,24 Z"/><path d="M100,21 L105,-3"/></g>
          <g transform="rotate(-105,100,100)"><path d="M100,24 C110,16 113,2 106,-6 C99,2 96,16 100,24 Z"/><path d="M100,21 L105,-3"/></g>
          <g transform="rotate(-120,100,100)"><path d="M100,24 C110,16 113,2 106,-6 C99,2 96,16 100,24 Z"/><path d="M100,21 L105,-3"/></g>
          <g transform="rotate(-135,100,100)"><path d="M100,24 C110,16 113,2 106,-6 C99,2 96,16 100,24 Z"/><path d="M100,21 L105,-3"/></g>
          <g transform="rotate(-150,100,100)"><path d="M100,24 C110,16 113,2 106,-6 C99,2 96,16 100,24 Z"/><path d="M100,21 L105,-3"/></g>
        </g>

        <!-- Keystone device with TWO fine parallel horizontal interior rules (distinct here;
             on the gained letterhead these two run together into one solid bar). -->
        <path class="stroke" d="M72,60 L128,60 L128,72 L120,72 L110,126 L90,126 L80,72 L72,72 Z"/>
        <line class="thin" x1="82.6" y1="86" x2="117.4" y2="86"/>
        <line class="thin" x1="85.2" y1="100" x2="114.8" y2="100"/>

        <!-- Ribbon banner with fishtail ends bearing the roman-numeral date. -->
        <path class="stroke" d="M52,178 L148,178 L166,172 L156,187 L166,202 L148,196 L52,196 L34,202 L44,187 L34,172 Z"/>
        <!-- Crossed ribbon tails at the wreath tie -->
        <path class="thin" d="M98,196 L91,211 L94,208 L90,215"/>
        <path class="thin" d="M102,196 L109,211 L106,208 L110,215"/>

        <!-- MCMXI drawn as stroked engraved letterforms (kept as vector paths, not live text). -->
        <g class="num">
          <path d="M70,193 L70,182 L75.5,188.5 L81,182 L81,193"/>
          <path d="M94,183.5 A5.5,5.5 0 1 0 94,191.5"/>
          <path d="M97,193 L97,182 L102.5,188.5 L108,182 L108,193"/>
          <path d="M111,182 L121,193 M121,182 L111,193"/>
          <path d="M127,182 L127,193 M124,182 L130,182 M124,193 L130,193"/>
        </g>
      </svg>
    </div>

    <!-- ONE continuous text story: suite number, forced line break, firm name.
         Not two addressable frames. -->
    <div class="story"><span class="suite">SUITE&nbsp;3C</span><br><span class="firm">Corliss&nbsp;&amp;&nbsp;Vane&nbsp;Solicitors</span></div>

  </div>
</body>
</html>
